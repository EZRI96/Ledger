<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0F1418"/>
<title>Birr Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F1418'/%3E%3Cpath d='M6 22 L26 22 M6 22 l4 -2 v4 z M26 22 l-4 -2 v4 z' stroke='%235FB8DC' stroke-width='1.6' fill='%235FB8DC'/%3E%3Ctext x='16' y='15' font-family='monospace' font-size='11' font-weight='700' fill='%23E9EEEB' text-anchor='middle'%3EBR%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"/>
</head>
<body>
<div id="root"></div>

<style>
/* ============================================================
   BIRR LEDGER — drawing-sheet interface, v4
   Colour follows architectural markup convention, split by family:
     --blue (allowance)   = THIS MONTH: Personal bucket, Yours to spend, Runway
     --liquidity (cyan)   = TOTAL CASH: On hand, Can pay with, Earned (feeds reserves)
     --reserve (blue-gray)= Buffer, Essential spending — dormant, waiting
     --green (growth)     = Vault only — true savings, never spent
     --ochre (pending)    = other people's money — Owed to you, Lent out, Borrowed
     --red (alert)        = spending, Owed by you, danger — Choice/Discretionary spend
   One color, one meaning, everywhere it appears — including ring segments and
   every number that represents that same thing.
   Type: Space Grotesk for headings/hero numbers/prose. Monospace for all data.
   Panels carry a colored left edge (solid = one meaning; stacked/proportional =
   a mixed panel, never falsely claiming a single color).
   ============================================================ */

#root[data-theme="viewport"]{
  --ground:#0F1418; --plane:#161D22; --plane2:#1B242A;
  --edge:#29343B; --edge2:#3C4952;
  --chalk:#E9EEEB; --graphite:#8494A0; --faint:#5A6771;
  --blue:#5FB8DC; --red:#E45A44; --ochre:#DDA84A; --green:#4FB98A;
  --liquidity:#22B4CC; --reserve:#77879A;
  --gridline:rgba(255,255,255,.030);
  --glow:0 0 0 1px rgba(95,184,220,.18), 0 0 26px -6px rgba(95,184,220,.30);
  --lift:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 26px -18px #000;
}
#root[data-theme="vellum"]{
  --ground:#E3E7E3; --plane:#F8FAF7; --plane2:#EEF1ED;
  --edge:#C4CCC5; --edge2:#A6B0A7;
  --chalk:#111719; --graphite:#5C685F; --faint:#8B968D;
  --blue:#1D6C90; --red:#BF3A2B; --ochre:#946A1B; --green:#2C7C5A;
  --liquidity:#12798A; --reserve:#56636E;
  --gridline:rgba(17,23,25,.055);
  --glow:0 0 0 1px rgba(29,108,144,.16);
  --lift:0 1px 0 rgba(255,255,255,.7) inset, 0 8px 20px -18px #4b544c;
}

html,body{margin:0;padding:0;background:#0F1418}
#root{
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:"Space Grotesk",-apple-system,"Segoe UI","Helvetica Neue",Inter,system-ui,sans-serif;
  background:var(--ground);
  background-image:
    linear-gradient(var(--gridline) 1px,transparent 1px),
    linear-gradient(90deg,var(--gridline) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--chalk); font-family:var(--sans);
  min-height:100vh; padding:0 0 104px; -webkit-font-smoothing:antialiased;
  transition:background-color .35s ease,color .35s ease;
}
#root *{box-sizing:border-box}
#root ::selection{background:var(--blue);color:var(--ground)}
#root :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sheet{max-width:820px;margin:0 auto;padding:22px 18px 0}

/* ---------- type ---------- */
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- sheet header ---------- */
.hdr{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding-bottom:11px;margin-bottom:0;border-bottom:1.5px solid var(--chalk)}
.hdr h1{margin:0;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.4em;text-transform:uppercase}
.hdr h1::before{content:"◤ ";color:var(--blue);letter-spacing:0}
.hdrR{display:flex;align-items:center;gap:12px}
.themeb{border:1px solid var(--edge);background:transparent;color:var(--faint);font-family:var(--mono);
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:6px 9px;cursor:pointer;
  transition:border-color .18s,color .18s}
.themeb:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- tabs ---------- */
.nav{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin-bottom:24px;position:sticky;top:0;z-index:15;background:var(--ground);box-shadow:0 8px 14px -10px rgba(0,0,0,.5)}
.nav button{position:relative;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  padding:13px 16px;border:0;background:transparent;color:var(--faint);cursor:pointer;transition:color .18s}
.nav button:hover{color:var(--graphite)}
.nav button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue);
  transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.nav button.on{color:var(--chalk);font-weight:700}
.nav button.on::after{transform:scaleX(1)}

/* ---------- viewport panels: hairline frame + corner registration ticks ---------- */
.panel{position:relative;border:1px solid var(--edge);background:var(--plane);box-shadow:var(--lift)}
.panel::before,.panel::after{content:"";position:absolute;width:6px;height:6px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:1.5px solid var(--edge2);border-left:1.5px solid var(--edge2)}
.panel::after{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--edge2);border-right:1.5px solid var(--edge2)}
.panel.ppl{border-color:var(--ochre)}
.panel.ppl::before,.panel.ppl::after{border-color:var(--ochre)}
.panel.liq{border-color:var(--liquidity)}
.panel.liq::before,.panel.liq::after{border-color:var(--liquidity)}
.panel .ph{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  padding:9px 12px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;gap:8px}
.panel.ppl .ph{color:var(--ochre);border-bottom-color:var(--ochre)}
.panel.liq .ph{color:var(--liquidity);border-bottom-color:var(--liquidity)}
.panel .pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:9px 12px;border-bottom:1px solid var(--edge)}
.panel .pr:last-child{border-bottom:0}
.panel .pr .k{font-size:12.5px;min-width:0}
.panel .pr .k small{display:block;font-family:var(--mono);font-size:8.5px;color:var(--faint);
  letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.panel .pr .v{font-family:var(--mono);font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.panel .pr .v.neg{color:var(--red)} .panel .pr .v.pos{color:var(--green)}
.panel .pr .v.mute{color:var(--faint)} .panel .pr .v.warm{color:var(--ochre)}
.panel .tot{background:var(--plane2);font-weight:700}
.panel .sub{color:var(--graphite);font-style:italic}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}

/* ---------- alarms ---------- */
.alarm{position:relative;border:1px solid var(--red);background:var(--plane);padding:13px 15px 13px 16px;
  margin-bottom:20px;font-size:12.5px;line-height:1.55;color:var(--chalk);box-shadow:var(--lift)}
.alarm::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.alarm b{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);
  display:block;margin-bottom:6px}

/* ---------- day navigator ---------- */
.dnav{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--edge);
  background:var(--plane);padding:10px;margin-bottom:14px;box-shadow:var(--lift)}
.dnav .arw{border:1px solid transparent;background:transparent;font-family:var(--mono);font-size:16px;cursor:pointer;
  color:var(--graphite);padding:4px 12px;line-height:1;transition:color .16s,border-color .16s}
.dnav .arw:hover:not(:disabled){color:var(--blue);border-color:var(--edge)}
.dnav .arw:disabled{color:var(--edge);cursor:not-allowed}
.dnav .mid{text-align:center;flex:1;min-width:0}
.dnav .mid .dd{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.08em}
.dnav .mid .dw{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--faint);margin-top:4px}
.todaybtn{border:1px solid var(--edge);background:transparent;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.16em;text-transform:uppercase;padding:6px 8px;cursor:pointer;color:var(--faint);transition:.16s}
.todaybtn:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- stat grid ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.compare{display:flex;border:1px solid var(--edge);border-radius:10px;background:var(--plane);margin-bottom:8px}
.cside{flex:1;padding:12px 13px}
.cdiv{width:1px;background:var(--edge)}
.cv{font-family:var(--mono);font-size:19px;font-weight:700;margin:6px 0 7px}
.cv.growth{color:var(--green)} .cv.alert{color:var(--red)} .cv.allow{color:var(--blue)}
.cc{font-size:10.5px;color:var(--graphite);line-height:1.5}
.cel{background:var(--plane);border:1px solid var(--edge);border-radius:10px;
  padding:12px 12px 13px;transition:background .18s}
.cel:hover{background:var(--plane2)}
.cel .v{font-size:17px;font-weight:600;margin-top:7px;font-family:var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.cel.tap{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.cel.tap:hover .lbl{color:var(--ochre)}
.cel.tap.open{background:var(--plane2);box-shadow:inset 0 -2px 0 var(--ochre)}
.cel .v.in{color:var(--liquidity)} .cel .v.out{color:var(--red)} .cel .v.pos{color:var(--green)}
.cel .v.neg{color:var(--red)} .cel .v.mute{color:var(--faint)}

/* ---------- 14-day strip ---------- */
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:58px;margin-bottom:5px}
.strip button{border:0;background:transparent;padding:0;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;cursor:pointer;transition:opacity .16s}
.strip button:hover{opacity:.65}
.strip .b{width:100%;min-height:2px;
  background:linear-gradient(180deg,var(--red),color-mix(in srgb,var(--red) 30%,transparent))}
.strip .b.sel{outline:1px solid var(--chalk);outline-offset:1px}
.strip .b.gap{background:none;border:1px dashed var(--edge2);height:100%;min-height:0}
.strip .b.zero{background:var(--edge2);height:2px}
.stripx{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;text-align:center;margin-bottom:22px}
.stripx div{font-family:var(--mono);font-size:8px;color:var(--faint)}
.stripx div.sel{color:var(--chalk);font-weight:700}

  /* ---- combined day rail (picker + scrollable strip together) ---- */
  .railwrap{border:1px solid var(--edge);background:var(--plane);box-shadow:var(--lift);margin-bottom:14px}
  .railwrap .dnav{border:0;border-bottom:1px solid var(--edge);margin:0;box-shadow:none}
  .rail{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:10px 10px 8px;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .railcol{flex:0 0 auto;width:34px;border:0;background:transparent;padding:4px 0 0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:2px;transition:background .15s}
  .railcol:hover{background:var(--plane2)}
  .railcol.sel{background:color-mix(in srgb,var(--blue) 14%,transparent);outline:1px solid var(--blue);outline-offset:-1px}
  .railbar{height:46px;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .railbar .b{width:14px;min-height:2px;
    background:linear-gradient(180deg,var(--red),color-mix(in srgb,var(--red) 30%,transparent))}
  .railbar .b.gap{background:none;border:1px dashed var(--edge2);height:100%;min-height:0;width:14px}
  .railbar .b.zero{background:var(--edge2);height:3px}
  .railcol.sel .railbar .b{background:linear-gradient(180deg,var(--blue),color-mix(in srgb,var(--blue) 30%,transparent))}
  .railcol.sel .railbar .b.gap{border-color:var(--blue)}
  .rd{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--graphite)}
  .railcol.sel .rd{color:var(--blue)}
  .rw{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;color:var(--faint)}
  .railcol.sel .rw{color:var(--blue)}

/* ---------- capture buttons ---------- */
.cap-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.cap-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
button.big,button.sm{position:relative;overflow:hidden;font-family:var(--mono);text-transform:uppercase;
  cursor:pointer;background:transparent;transition:color .2s,border-color .2s,transform .08s}
button.big{font-size:10.5px;letter-spacing:.14em;padding:15px 6px;border:1px solid var(--edge2);color:var(--chalk)}
button.sm{font-size:9.5px;letter-spacing:.12em;padding:12px 6px;border:1px solid var(--ochre);color:var(--ochre)}
button.big::before,button.sm::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s}
button.big:hover::before,button.sm:hover::before{opacity:.12;transform:translateY(0)}
button.big:active,button.sm:active{transform:translateY(1px)}
button.big.inflow{border-color:var(--liquidity);color:var(--liquidity)}
button.big.outflow{border-color:var(--red);color:var(--red)}
button.big.xfer{border-color:var(--edge2);color:var(--graphite)}
button.big.on{background:var(--chalk);color:var(--ground);border-color:var(--chalk)}
button.big.inflow.on{background:var(--blue);color:var(--ground);border-color:var(--blue)}
button.big.outflow.on{background:var(--red);color:#fff;border-color:var(--red)}
button.big.xfer.on{background:var(--graphite);color:var(--ground);border-color:var(--graphite)}
button.sm.on{background:var(--ochre);color:var(--ground)}
button.big:disabled,button.sm:disabled{opacity:.3;cursor:not-allowed}

/* ---------- repeat chips ---------- */
.quick{margin-bottom:20px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qchip{font-family:var(--mono);font-size:10.5px;padding:8px 11px;border:1px dashed var(--edge2);
  background:var(--plane);cursor:pointer;color:var(--graphite);white-space:nowrap;transition:.16s}
.qchip:hover{border-style:solid;border-color:var(--red);color:var(--red);background:var(--plane2)}
.qchip b{font-weight:700;color:var(--chalk)}
.qchip:hover b{color:var(--red)}

/* ---------- forms ---------- */
.form{position:relative;border:1px solid var(--chalk);background:var(--plane);padding:18px;margin-bottom:22px;
  border-radius:12px;overflow:hidden;box-shadow:var(--lift)}
.form::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--chalk)}
.form.people{border-color:var(--ochre)} .form.people::before{background:var(--ochre)}
.form.spend{border-color:var(--red)} .form.spend::before{background:var(--red)}
.form.earn{border-color:var(--blue)} .form.earn::before{background:var(--blue)}
.form.warnb{border-color:var(--red)} .form.warnb::before{background:var(--red)}
.amt{width:100%;border:0;border-bottom:1.5px solid var(--edge2);background:transparent;font-family:var(--mono);
  font-size:34px;font-weight:700;padding:2px 0 10px;color:var(--chalk);outline:none;letter-spacing:-.035em;
  transition:border-color .2s}
.amt:focus{border-bottom-color:var(--blue)}
.amt::placeholder{color:var(--edge2)}
.grp{margin-top:16px}
.gname{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:10.5px;padding:7px 10px;border:1px solid var(--edge);background:transparent;
  cursor:pointer;color:var(--graphite);white-space:nowrap;transition:.14s}
.chip:hover{border-color:var(--graphite);color:var(--chalk)}
.chip.on{border-color:var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent);font-weight:700}
.chip:disabled{opacity:.25;cursor:not-allowed}
.newp{margin-top:10px}
.newp input,.note,.fee{width:100%;border:1px solid var(--edge);background:transparent;font-size:16px;padding:10px;
  color:var(--chalk);outline:none;font-family:var(--sans);transition:border-color .18s}
.newp input{font-family:var(--mono);border:0;border-bottom:1px solid var(--edge)}
.note{margin-top:16px}
.fee{margin-top:10px;border-color:color-mix(in srgb, var(--red) 35%, var(--edge));font-family:var(--mono);font-size:14px}
.fee::placeholder{color:color-mix(in srgb, var(--red) 55%, var(--faint))}
.note:focus,.newp input:focus{border-color:var(--blue)}
.fee:focus{border-color:var(--red)}
.fall{border-top:1px dashed var(--edge2);margin-top:17px;padding-top:13px}
.fall .r{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;padding:4px 0;
  color:var(--graphite)}
.fall .r span:last-child{font-weight:700;white-space:nowrap;color:var(--chalk)}
.fall .r.z span{color:var(--edge2)}
.truth{border-top:1px dashed var(--ochre);margin-top:15px;padding-top:12px;font-size:12.5px;line-height:1.6;
  color:var(--graphite)}
.truth b{color:var(--ochre)}
.truth.bad{border-top-color:var(--red);color:var(--red)} .truth.bad b{color:var(--red)}
.save{width:100%;margin-top:18px;padding:14px;border:0;background:var(--chalk);color:var(--ground);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;cursor:pointer;
  transition:filter .16s,transform .08s}
.save:hover:not(:disabled){filter:brightness(1.12)} .save:active:not(:disabled){transform:translateY(1px)}
.save:disabled{background:var(--edge);color:var(--faint);cursor:not-allowed}
.save.inflow{background:var(--liquidity)} .save.ppl{background:var(--ochre)}
.save.danger{background:var(--red);color:#fff} .save.good{background:var(--green);color:var(--ground)}
.hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-top:10px;
  text-align:center;min-height:12px}

/* ---------- ledger rows ---------- */
.row{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:baseline;padding:12px 0;
  border-bottom:1px solid var(--edge);transition:padding-left .18s}
.row:hover{padding-left:5px}
.row .d{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.04em}
.row .t{font-size:13px}
.row .t small{display:block;font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:.12em;
  text-transform:uppercase;margin-top:3px}
.row .a{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.row .a.in{color:var(--blue)} .row .a.out{color:var(--red)}
.row .a.xf{color:var(--graphite)} .row .a.pp{color:var(--ochre)}
.row .del,.row .edt{border:0;background:transparent;color:transparent;cursor:pointer;font-size:14px;
  padding:0 0 0 10px;line-height:1;transition:color .16s}
.row:hover .del,.row:hover .edt{color:var(--edge2)}
.row .del:hover{color:var(--red)}
.row .edt:hover{color:var(--blue)}
.row .edt.on{color:var(--blue)}
.row.editing{background:color-mix(in srgb,var(--blue) 7%,transparent);
  outline:1px solid var(--blue);outline-offset:-1px;padding-left:8px}
@media(hover:none){.row .del,.row .edt{color:var(--edge2)}}

/* ---------- bars ---------- */
.bar{height:6px;background:var(--plane2);margin-top:8px;position:relative;overflow:hidden;border:1px solid var(--edge)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--reserve)}
.anim .bar i{animation:grow .6s cubic-bezier(.2,.85,.25,1) both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
.bar i.over{background:var(--red)} .bar i.disc{background:var(--red)}
.bar i.work{background:var(--blue)} .bar i.ok{background:var(--green)}

/* ---------- sections ---------- */
.sec{margin:0 0 30px}
.sec h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  font-weight:400;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--edge);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h3 em{font-style:normal;color:var(--chalk);font-weight:700}

/* ---------- week bars ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;margin:16px 0 8px}
.wk button{border:0;background:transparent;padding:0;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;cursor:pointer;transition:opacity .16s}
.wk button:hover{opacity:.7}
.wk .b{width:100%;min-height:3px;
  background:linear-gradient(180deg,var(--red),color-mix(in srgb,var(--red) 22%,transparent))}
.anim .wk .b{animation:grow2 .55s cubic-bezier(.2,.85,.25,1) both}
@keyframes grow2{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1)}}
.wk .b.today{outline:1px solid var(--chalk);outline-offset:1px}
.wk .b.zero{background:var(--edge2)}
.wkx{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}

/* ---------- month calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal .cd{aspect-ratio:1;border:1px solid var(--edge);background:var(--plane);cursor:pointer;
  display:flex;align-items:flex-start;justify-content:flex-end;padding:4px;transition:.14s}
.cal .cd span{font-family:var(--mono);font-size:8px;color:var(--faint)}
.cal .cd.pad{border:0;background:transparent;cursor:default}
.cal .cd.miss{border-style:dashed;border-color:var(--edge2)}
.cal .cd:hover{outline:1px solid var(--blue);outline-offset:1px;transform:scale(1.06)}
.calx{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:8px}

/* ---------- plan cards ---------- */
.plan{position:relative;border:1px solid var(--edge);background:var(--plane);padding:16px 18px;margin-bottom:14px;
  border-radius:10px;overflow:hidden;box-shadow:var(--lift);transition:border-color .2s}
.plan::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--edge2)}
.plan:hover{border-color:var(--edge2)}
.plan.alert::before{background:var(--red)} .plan.good::before{background:var(--green)}
.plan.warm::before{background:var(--ochre)}
.plan.allow::before{background:var(--blue)}
.plan .h{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.plan .k{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.plan .n{font-family:var(--mono);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;white-space:nowrap}
.plan .n.rev{color:var(--red)} .plan .n.ok{color:var(--green)} .plan .n.dim{color:var(--blue)}
.plan .n.warm{color:var(--ochre)}
.plan p{font-size:12.5px;color:var(--graphite);line-height:1.65;margin:9px 0 0}
.plan b{color:var(--chalk);font-weight:600}
.act{margin-top:12px;border:1px solid var(--chalk);background:transparent;color:var(--chalk);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;
  cursor:pointer;transition:.16s;border-radius:16px}
.act:hover{background:var(--chalk);color:var(--ground)}
.ord{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;
  border-bottom:1px dashed var(--edge);font-size:12.5px}
.ord:last-child{border-bottom:0}
.ord .rk{font-family:var(--mono);font-size:9px;color:var(--faint);margin-right:10px}
.ord .rt{font-family:var(--mono);font-size:12.5px;font-weight:700}
.ord .rt.owe{color:var(--red)} .ord .rt.owed{color:var(--ochre)}

/* ---------- confidence banner ---------- */
.conf{border:1px dashed var(--edge2);padding:14px 15px;margin-bottom:22px;font-size:12.5px;color:var(--graphite);
  line-height:1.65;background:var(--plane)}
.conf b{color:var(--chalk)}
.conf .tagx{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:700}
.conf.bad{border-color:var(--red);border-style:solid}
.conf.bad .tagx{color:var(--red)}

/* ---------- zero-day ---------- */
.zbtn{width:100%;padding:13px;border:1px dashed var(--edge2);background:transparent;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);cursor:pointer;margin-top:8px;
  transition:.16s}
.zbtn:hover{border-style:solid;border-color:var(--green);color:var(--green)}
.zbadge{border:1px solid var(--green);color:var(--green);padding:11px 13px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.zbadge button{border:0;background:transparent;color:var(--faint);font-family:var(--mono);font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.zbadge button:hover{color:var(--red)}
.empty{padding:32px 0;text-align:center;color:var(--faint);font-size:13px;line-height:1.75}

/* ---------- title block ---------- */
.tblock{position:fixed;left:0;right:0;bottom:0;background:var(--plane);border-top:1.5px solid var(--chalk);
  display:flex;z-index:20;backdrop-filter:blur(6px);padding-bottom:env(safe-area-inset-bottom)}
.tblock .cell{flex:1;padding:11px 13px;border-right:1px solid var(--edge);min-width:0}
.tblock .cell:last-child{border-right:0}
.tblock .cell .v{font-family:var(--mono);font-size:14px;font-weight:700;margin-top:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tblock .cell .v.warn{color:var(--red)} .tblock .cell .v.mute{color:var(--faint)}
.tblock .cell .v.pos{color:var(--green)}

/* ---------- settings ---------- */
.cfg{position:relative;border:1px solid var(--blue);background:var(--plane);padding:20px;margin-bottom:24px;
  border-radius:12px;overflow:hidden;box-shadow:var(--glow)}
.cfg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.cfg h4{margin:0 0 7px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.cfg p{margin:0 0 20px;font-size:12.5px;color:var(--graphite);line-height:1.65}
.cfg .fl{margin-bottom:18px}
.cfg input{width:100%;border:0;border-bottom:1.5px solid var(--edge2);background:transparent;font-family:var(--mono);
  font-size:20px;padding:4px 0 8px;color:var(--chalk);outline:none;transition:border-color .18s}
.cfg input:focus{border-bottom-color:var(--blue)}
.cfg .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cfg .g3 input{font-size:16px}
.cfg input,.newp input,.note,.amt{-webkit-text-size-adjust:100%}
input,button,select,textarea{touch-action:manipulation}
.cfg .err{color:var(--red);font-family:var(--mono);font-size:10.5px;margin-top:12px;min-height:14px;line-height:1.5;
  letter-spacing:.04em}
.cfg .btns{display:flex;gap:9px;margin-top:16px}
.cfg .btns button{flex:1;padding:14px;border:0;background:var(--blue);color:var(--ground);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:filter .16s}
.cfg .btns button:hover{filter:brightness(1.12)}
.cfg .btns button.ghost{background:transparent;border:1px solid var(--edge2);color:var(--graphite)}
.cfg hr{border:0;border-top:1px dashed var(--edge2);margin:22px 0}
.prow{display:grid;grid-template-columns:1fr 100px 96px 26px;gap:9px;align-items:end;margin-bottom:13px}
.prow input{font-size:16px}
.prow .dir{border:1px solid var(--edge2);background:transparent;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:8px 4px;cursor:pointer;color:var(--faint);
  white-space:nowrap;transition:.16s}
.prow .dir.owe{border-color:var(--red);color:var(--red)}
.prow .dir.owed{border-color:var(--green);color:var(--green)}
.prow .x{border:0;background:transparent;color:var(--edge2);cursor:pointer;font-size:16px;padding:0 0 8px}
.prow .x:hover{color:var(--red)}
.addp{border:1px dashed var(--edge2);background:transparent;width:100%;padding:11px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);cursor:pointer;transition:.16s}
.addp:hover{border-style:solid;border-color:var(--blue);color:var(--blue)}

/* ---------- tools ---------- */
.tools{display:flex;gap:18px;margin:36px 0 14px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--edge)}
.tools button{border:0;background:transparent;color:var(--faint);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:0;transition:color .16s}
.tools button:hover{color:var(--blue)}
.tools button.danger:hover{color:var(--red)}

/* ---- HOME composition ring ---- */
.ringzone{display:flex;justify-content:center;margin:14px 0 8px}
.ringzone svg{overflow:visible}

/* ---- legend panels: colored left edge instead of corner ticks — Home's two board panels only ---- */
.legend{border:1px solid var(--edge);background:var(--plane);margin-bottom:16px;border-radius:10px;
  position:relative;overflow:hidden;padding-left:4px}
.legend::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.legend.liq::before{background:var(--liquidity)}
.legend.mix::before{background:transparent}
.lh{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--edge)}
.lh svg{flex:0 0 auto}
.lh .t{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite)}
.legend .row{display:flex;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--edge);font-size:13px}
.legend .row:last-child{border-bottom:0}
.legend .row .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.legend .row.tot{background:var(--plane2);font-weight:700}
.legend .alloc{display:flex;gap:2px;height:6px;margin:0 13px 11px;background:transparent;border:0}
.legend .aseg{border-radius:2px}


/* ---- HOME allocation bars ---- */
.alloc{display:flex;height:7px;width:100%;overflow:hidden;border:1px solid var(--edge);
  background:var(--plane2);margin:0 0 2px}
.aseg{height:100%;transition:width .3s ease}
.aseg.empty{background:repeating-linear-gradient(45deg,var(--edge2) 0 4px,transparent 4px 8px)}
.ringempty{text-align:center;padding:0 14px 14px;font-size:11.5px;color:var(--faint);line-height:1.5}

/* ---- hero runway number: the true headline, expressive type over the ring ---- */
.heroline{text-align:center;margin-bottom:6px}
.heroline .n{font-family:var(--sans);font-size:64px;font-weight:700;line-height:.9;
  letter-spacing:-.04em;color:var(--blue)}
.heroline .c{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;margin-top:8px}

/* ---- two-column ring key, stacked BELOW the ring (never beside it — that's what overflowed) ---- */
.keys{display:flex;justify-content:space-between;gap:14px;padding:0 6px 6px;margin-bottom:20px}
.keycol{flex:1;display:flex;flex-direction:column;gap:7px}
.keycol .kh{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;margin-bottom:2px}
.kx{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--graphite)}
.kx i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.kx b{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--chalk);font-size:11.5px}
.anim .aseg{animation:grow .5s cubic-bezier(.2,.85,.25,1) both}

/* ---- 4-column title block ---- */
.tblk{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--chalk);
  border-radius:12px;overflow:hidden;background:var(--plane);margin-bottom:24px}
.tblk div{padding:12px 8px;border-right:1px solid var(--edge)}
.tblk div:last-child{border-right:0}
.tblk .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:6px}
.tblk .v.blue{color:var(--blue)} .tblk .v.liq{color:var(--liquidity)}
.tblk .v.alert{color:var(--red)} .tblk .v.warm{color:var(--ochre)}

/* ---- mixed-edge legend panel: proportional stacked colors, no single false claim ---- */
.mixedge{position:absolute;left:0;top:0;bottom:0;width:4px;display:flex;flex-direction:column;overflow:hidden}

/* ---- people avatar chips ---- */
.peoplewrap{margin-bottom:16px}
.peoplehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.peoplehead .t{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.peoplehead .v{font-family:var(--mono);font-size:15px;font-weight:700}
.prow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px}
.achip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:58px}
.achip .av{width:46px;height:46px;border-radius:50%;border:1.4px solid;display:flex;
  align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:14px}
.achip .nm{font-size:10px;color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.achip .am{font-family:var(--mono);font-size:10px;font-weight:600}

/* ---- REVIEW toggle bar ---- */
.revbar{display:inline-flex;border:1px solid var(--edge2);margin-bottom:20px;border-radius:10px;overflow:hidden}
.revtab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 20px;
  border:0;background:transparent;color:var(--faint);cursor:pointer;transition:.15s}
.revtab.on{background:var(--blue);color:var(--ground);font-weight:700}

/* ---- YEAR tab ---- */
.yh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;
  padding-bottom:8px;border-bottom:1px solid var(--edge)}
.yh .yr{font-family:var(--sans);font-size:20px;font-weight:700;letter-spacing:-.01em}
.yh .tag2{font-family:var(--mono);font-size:12px;font-weight:700}
.yh .tag2.saved{color:var(--green)} .yh .tag2.over{color:var(--red)}
.ytot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.ycell{background:var(--plane);border:1px solid var(--edge);border-radius:10px;padding:10px 11px}
.ycell .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.ycell .v.in{color:var(--liquidity)} .ycell .v.out{color:var(--red)} .ycell .v.pos{color:var(--green)}
.ycell .v.neg{color:var(--red)} .ycell .v.mute{color:var(--faint)}
.ybreak{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;padding:11px 13px;border:1px solid var(--edge);
  border-radius:10px;margin-bottom:16px;background:var(--plane)}
.ybreak .br{display:flex;gap:7px;align-items:baseline;font-size:12px;color:var(--graphite)}
.ybreak .br .num{color:var(--chalk);font-weight:600}
.ym{border:1px solid var(--edge);background:var(--plane);box-shadow:var(--lift);border-radius:12px;margin-bottom:9px;padding:12px 13px}
.ymh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.ymname{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em}
.ymnet{font-family:var(--mono);font-size:12.5px;font-weight:700}
.ymnet.pos{color:var(--green)} .ymnet.neg{color:var(--red)}
.ymgrid{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center}
.ymgrid .yl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);white-space:nowrap}
.ymgrid .yl.sub{color:var(--faint);padding-left:6px;font-size:9px}
.ymgrid .yb{height:8px;background:var(--plane2);position:relative;overflow:hidden;border:1px solid var(--edge)}
.ymgrid .yb i{position:absolute;inset:0 auto 0 0}
.anim .ymgrid .yb i{animation:grow .55s cubic-bezier(.2,.85,.25,1) both}
.yb i.ern{background:var(--liquidity)} .yb i.spt{background:var(--red)}
.yb i.ess{background:var(--reserve)} .yb i.dsc{background:var(--red)} .yb i.wrk{background:var(--blue)}
.ymgrid .yv{font-family:var(--mono);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:52px}
.ymgrid .yv.in{color:var(--blue)} .ymgrid .yv.out{color:var(--red)}
.ymbig{margin-top:10px;padding-top:9px;border-top:1px dashed var(--edge);font-size:11.5px;color:var(--graphite)}
.ymbig b{color:var(--chalk);font-weight:600}
.ymbig .mut{color:var(--faint)} .ymbig .amt{font-family:var(--mono);color:var(--red);font-weight:700}

.ovl{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ground) 82%,transparent);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.ovl .card{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--plane);
  border:1px solid var(--blue);box-shadow:var(--glow);position:relative}
.ovl .card .ph{position:sticky;top:0;background:var(--plane);font-family:var(--mono);font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:12px 14px;
  border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center}
.ovl .xx{border:0;background:transparent;color:var(--faint);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.ovl .xx:hover{color:var(--red)}
.ovl .bkp{font-size:12.5px;color:var(--graphite);line-height:1.6;margin:0;padding:14px 16px 8px}
.ovl .bkp b{color:var(--chalk)} .ovl .bkp em{color:var(--blue);font-style:normal}
.bkta{width:calc(100% - 32px);margin:6px 16px;height:150px;resize:vertical;
  font-family:var(--mono);font-size:12px;line-height:1.5;padding:10px;color:var(--chalk);
  background:var(--ground);border:1px solid var(--edge);outline:none;white-space:pre;word-break:break-all}
.bkta:focus{border-color:var(--blue)}
.bkrow{display:flex;gap:8px;padding:8px 16px 4px}
.bkrow .save{margin-top:0;flex:1}
.save.ghost2{background:transparent;border:1px solid var(--edge2);color:var(--graphite)}
.save.ghost2:hover:not(:disabled){filter:none;border-color:var(--blue);color:var(--blue)}
.ovl .hint{padding:4px 16px 16px}

@media(max-width:660px){
  .board{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .nw{flex-direction:column;align-items:flex-start;gap:14px}
  .nw .l{max-width:100%}
  .nwR{align-items:flex-start;width:100%}
  .spark{width:100%}
  .nav button{padding:13px 11px;font-size:10px}
  .plan .n{font-size:18px}
  .prow{grid-template-columns:1fr 78px 82px 22px;gap:6px}
  .cfg .g3{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){
  #root *,#root *::before,#root *::after{animation:none!important;transition:none!important}
}

/* ---- server edition: attachments, account, users ---- */
.attl{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.attadd{cursor:pointer;color:var(--blue);border-style:dashed}
.attc{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;padding:6px 8px 6px 10px;
  border:1px solid var(--edge2);color:var(--chalk);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attc.new{border-color:var(--blue)}
.attc button{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.attc button:hover{color:var(--red)}
.row .attb{border:0;background:transparent;color:var(--graphite);cursor:pointer;font-size:12px;padding:0 6px;font-family:var(--mono)}
.row .attb:hover{color:var(--blue)}
.attv{padding:8px 16px 16px}
.attimg img{display:block;max-width:100%;height:auto;border:1px solid var(--edge);margin-top:8px}
.attimg a,.attpdf a{display:inline-block;margin:8px 0 14px;font-family:var(--mono);font-size:10.5px;color:var(--blue);word-break:break-all}
.pform{padding:6px 16px 0}
.pform input{width:100%;margin:6px 0;border:0;border-bottom:1.5px solid var(--edge2);background:transparent;color:var(--chalk);
  font-family:var(--mono);font-size:16px;padding:8px 0;outline:0;border-radius:0}
.pform input:focus{border-bottom-color:var(--blue)}
.urow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--edge)}
.urow.off{opacity:.55}
.urow .un b{font-size:13px;font-weight:600} .urow .un small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.urow .ub{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

</style>

<script>
(function(){
  const S=100, DAY=86400000, TBILL=12.4;

  const INCOME_SRC=['Design fee','Finishing job','Other'];
  const ACCOUNTS=['Cash','telebirr','Bank'];
  const CATS=[
    {g:'Essential',    items:['Rent','Groceries','Food','Transport','Electricity','Water','Mobile/Internet','Health','Family']},
    {g:'Discretionary',items:['Eating out','Coffee','Recreation','Social','Clothing/Grooming','Household','Travel','Equipment/Accessory','Giveaway']},
    {g:'Work',         items:['Printing/Plotting','Tools/Software','Site costs','Work transport','Books']}
  ];
  const GROUP_OF={}; CATS.forEach(c=>c.items.forEach(i=>GROUP_OF[i]=c.g));
  const BUCKETS=[
    {k:'personal',n:'Personal', d:'This month\u2019s allowance'},
    {k:'buffer',  n:'Buffer',   d:'Dry months'},
    {k:'vault',   n:'Vault',    d:'Never spent'},
    {k:'lent',    n:'Lent out',  d:'Yours — but out of reach'},
    {k:'borrowed',n:'Borrowed', d:'Not yours — you owe it'}
  ];

  let db=null, tab='home', mode=null, draft={}, sel=null, editing=false, cfgErr='', cfg=null;
  let focusAmt=false;   // true only on the form's first render — never re-fires on a chip tap
  let focusFee=false;   // same pattern, for the fee input
  let reviewMode='week';                               // 'week' | 'month' for the Review tab
  let theme='viewport', animate=true, pplView=null;   // null | 'owe' | 'owed'
  let editId=null;                                     // entry being edited, or null
  let showBackup=false, showRestore=false;
  const THEMEKEY='birrledger:theme';

  const key=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  const fromKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getTime();};
  const today=()=>key(Date.now());
  const shift=(k,n)=>key(fromKey(k)+n*DAY);
  const toS=v=>Math.round(parseFloat(v||0)*S);
  const fmt=c=>Math.round(c/S).toLocaleString('en-US');
  const fmtS=c=>(c<0?'−':'')+fmt(Math.abs(c));
  const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  // ---------- session + server ----------
  // Data lives in Google Sheets/Drive behind Apps Script. The browser only keeps a sign-in token
  // (and the theme) in localStorage — both optional: if storage is blocked you just sign in each visit.
  const TOKENKEY='birrledger:token';
  let token=null, me=null, rev=0, saved={entries:new Map(),meta:'{}'};
  const lsGet=k=>{ try{ return window.localStorage.getItem(k); }catch(e){ return null; } };
  const lsSet=(k,v)=>{ try{ window.localStorage.setItem(k,v); }catch(e){} };
  const lsDel=k=>{ try{ window.localStorage.removeItem(k); }catch(e){} };

  function RPC(method,args){
    return new Promise(res=>{
      if(typeof google==='undefined'||!google.script||!google.script.run){
        res({ok:false,code:'NET',msg:'This page must be opened from the Apps Script web app URL.'}); return; }
      google.script.run
        .withSuccessHandler(r=>{
          r=r||{ok:false,code:'SERVER',msg:'Empty response from server.'};
          if(!r.ok && r.code==='AUTH' && method!=='login') signOut(r.msg);
          res(r);})
        .withFailureHandler(e=>res({ok:false,code:'NET',msg:(e&&e.message)||'Network error.'}))
        .rpc(method, token, args||{});
    });
  }

  const metaOf=d=>{ const m=Object.assign({},d); delete m.entries; return m; };

  // Server document -> in-memory ledger. Also runs on restored backups, so old backup formats still work.
  function normalize(raw){
    db=raw||{};
    if(!Array.isArray(db.entries)) db.entries=[];
    if(!Array.isArray(db.zero))    db.zero=[];
    if(typeof db.lastBackup!=='number') db.lastBackup=0;
    // v4 debts -> v5 people (a debt is a person with a negative balance)
    if(!Array.isArray(db.people)){
      db.people=Array.isArray(db.debts)?db.debts.map(d=>({id:d.id,name:d.name,opening:-(d.opening||0)})):[];
    }
    delete db.debts;
    if(!db.setup||typeof db.setup!=='object') db.setup={};
    if(typeof db.setup.floor!=='number') db.setup.floor=0;
    if(typeof db.setup.bufferMonths!=='number') db.setup.bufferMonths=3;
    if(!db.setup.opening||typeof db.setup.opening!=='object') db.setup.opening={};
    ACCOUNTS.forEach(a=>{ if(typeof db.setup.opening[a]!=='number') db.setup.opening[a]=0; });
    delete db.setup.opening.Equb; delete db.setup.split;
    db.entries=db.entries.filter(e=>e&&e.id&&e.acct!=='Equb'&&e.from!=='Equb'&&e.to!=='Equb');
    db.entries.forEach(e=>{
      if(!e.day) e.day=key(e.ts||Date.now());
      if(e.bucket==='tax') e.bucket='buffer';
      if(e.type==='out'&&!e.bucket) e.bucket='personal';
      if(e.type==='borrow'){ e.type='pin';  e.person=e.debtId; }   // money IN from a person
      if(e.type==='repay'){  e.type='pout'; e.person=e.debtId; }   // money OUT to a person
    });
    // opening-balance loans repay to Buffer (no recorded origin)
    db.people.forEach(x=>{ if((x.opening||0)>0 && !x.originBucket) x.originBucket='buffer'; });
    // MONTHLY-ENVELOPE MIGRATION (Option 3): stamp the day the envelope model began.
    // Set once, the first time the new engine loads a ledger that already has a floor.
    if(db.setup.floor>0 && !db.setup.envStart) db.setup.envStart=today();
    return db;
  }

  // Fetch the signed-in user's ledger. The "saved" snapshot is taken BEFORE normalising so that any
  // migration the normaliser performs is detected as a change and written back on the next save.
  async function load(){
    const r=await RPC('load');
    if(!r.ok) throw r;
    const raw=r.data.doc||{};
    rev=r.data.rev; me=r.data.user;
    saved={entries:new Map((raw.entries||[]).filter(e=>e&&e.id).map(e=>[e.id,JSON.stringify(e)])), meta:JSON.stringify(metaOf(raw))};
    normalize(raw);
  }
  const BACKUP_EVERY=14*DAY;
  const backupDue=()=>{
    if(!db||!db.entries||db.entries.length<3) return false;
    if(!db.lastBackup) return true;
    return (Date.now()-db.lastBackup) > BACKUP_EVERY;
  };

  // Saves are sent as a delta (changed/removed entries by id, settings only when changed) and
  // serialised so rapid taps can never interleave. The snapshot only advances on success, so a
  // failed save is simply re-sent, with everything since, by the next one.
  let saveOk=true, saveQ=Promise.resolve();
  const save=()=>(saveQ=saveQ.then(doSave,doSave));
  async function doSave(){
    if(!db||!token||viewAs) return;         // read-only "view as": nothing is ever written back
    const cur=new Map(db.entries.map(e=>[e.id,JSON.stringify(e)]));
    const metaStr=JSON.stringify(metaOf(db));
    const upserts=[], deletes=[];
    db.entries.forEach(e=>{ if(saved.entries.get(e.id)!==cur.get(e.id)) upserts.push(e); });
    saved.entries.forEach((_,id)=>{ if(!cur.has(id)) deletes.push(id); });
    const metaChanged=metaStr!==saved.meta;
    if(!upserts.length&&!deletes.length&&!metaChanged) return;
    const payload={baseRev:rev,upserts,deletes};
    if(metaChanged) payload.meta=metaOf(db);
    const r=await RPC('save',payload);
    const before=saveOk;
    if(r.ok){
      saveOk=true; rev=r.data.rev; saved={entries:cur,meta:metaStr};
      if(r.data.stale){ await refreshFromServer(); }          // another device saved too — pick up its entries
    }else if(r.code==='CONFLICT'){
      saveOk=true;
      await refreshFromServer();
      alert('This ledger was changed on another device, so it has been reloaded. Please redo your last change.');
    }else if(r.code==='AUTH'){
      return;                                                   // RPC already routed to the sign-in screen
    }else{
      saveOk=false;
    }
    if(before!==saveOk||r.code==='CONFLICT') render();
  }
  async function refreshFromServer(){
    const keep=sel;
    try{ await load(); sel=keep; render(); }catch(e){ if(!(e&&e.code==='AUTH')) saveOk=false; }
  }

  function signOut(msg){
    token=null; me=null; db=null; mode=null; draft={}; editId=null; panel=null; attView=null; usersList=null; newCred=null;
    lsDel(TOKENKEY);
    fileCache.forEach(f=>URL.revokeObjectURL(f.url)); fileCache.clear();
    renderLogin(msg||'');
  }

  // ---------- attachments ----------
  const ATT_MAX=5*1024*1024, ATT_LIMIT=5, IMG_EDGE=1600;
  const fileCache=new Map();                       // fileId -> {url,name,mime}
  let panel=null, attView=null, usersList=null, newCred=null, panelErr='';
  let viewAs=null, auditList=null;           // admin "view as" read-only mode: {id,username,name}
  let myDb=null, myMe=null, myRev=0, mySaved=null;   // the admin's own ledger, parked while viewing someone else's
  const RO=()=>!!viewAs;
  const readB64=blob=>new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]||'');
    r.onerror=()=>rej(new Error('Could not read the file.'));
    r.readAsDataURL(blob); });
  const loadImg=file=>new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error(file.name+': this image format cannot be read. Use JPEG, PNG or WebP.')); };
    im.src=u; });
  // Photos are shrunk to JPEG (max 1600px) before upload: receipts stay legible, uploads stay fast.
  async function prepFile(file){
    if(file.type==='application/pdf'){
      if(file.size>ATT_MAX) throw new Error(file.name+': PDF is over 5 MB.');
      return {name:file.name,mime:file.type,b64:await readB64(file),size:file.size};
    }
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error(file.name+': use a photo (JPEG, PNG, WebP) or a PDF.');
    const im=await loadImg(file);
    const k=Math.min(1,IMG_EDGE/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    if(!blob||blob.size>ATT_MAX) throw new Error(file.name+': image is too large even after shrinking.');
    return {name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',b64:await readB64(blob),size:blob.size};
  }
  const attCount=()=>(draft.att||[]).length+(draft.newFiles||[]).length;
  function attField(){
    const have=(draft.att||[]).map((a,i)=>`<span class="attc">📎 ${esc(a.name)}<button data-attx="a${i}" title="Remove">×</button></span>`);
    const fresh=(draft.newFiles||[]).map((a,i)=>`<span class="attc new">📎 ${esc(a.name)}<button data-attx="n${i}" title="Remove">×</button></span>`);
    return `<div class="grp"><div class="gname">Receipt / attachment</div><div class="attl">
        ${have.concat(fresh).join('')}
        ${attCount()<ATT_LIMIT?`<label class="chip attadd">+ Add photo or PDF<input type="file" id="attf" accept="image/*,application/pdf" multiple hidden/></label>`:''}
      </div>${draft.attErr?`<div class="hint" style="color:var(--red)">${esc(draft.attErr)}</div>`:''}</div>`;
  }
  const b64Blob=(b64,mime)=>{ const bin=atob(b64), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); };
  async function openAtt(entryId){
    const e=db.entries.find(x=>x.id===entryId); if(!e||!e.att||!e.att.length) return;
    panel='att'; attView={entryId,items:e.att.map(a=>({a,state:fileCache.has(a.fileId)?'ok':'load',msg:''}))}; render();
    for(const it of attView.items){
      if(it.state==='ok') continue;
      const r=await RPC('file',{fileId:it.a.fileId});
      if(!attView) return;                                   // closed meanwhile
      if(r.ok){ fileCache.set(it.a.fileId,{url:URL.createObjectURL(b64Blob(r.data.b64,r.data.mime)),name:r.data.name,mime:r.data.mime}); it.state='ok'; }
      else{ it.state='err'; it.msg=r.msg||'Could not load.'; }
      if(panel==='att') render();
    }
  }
  function attSheet(){
    if(panel!=='att'||!attView) return '';
    return `<div class="ovl" id="ovlp"><div class="card">
      <div class="ph"><span>Attachments</span><button class="xx" id="p_x">✕</button></div>
      <div class="attv">${attView.items.map(it=>{
        const f=fileCache.get(it.a.fileId);
        if(it.state==='load') return `<div class="hint">Loading ${esc(it.a.name)}…</div>`;
        if(it.state==='err')  return `<div class="hint" style="color:var(--red)">${esc(it.a.name)}: ${esc(it.msg)}</div>`;
        return f.mime==='application/pdf'
          ? `<div class="attpdf"><a href="${f.url}" download="${esc(it.a.name)}" target="_blank" rel="noopener">⬇ ${esc(it.a.name)} (PDF)</a></div>`
          : `<div class="attimg"><img src="${f.url}" alt="${esc(it.a.name)}"/><a href="${f.url}" download="${esc(it.a.name)}">⬇ ${esc(it.a.name)}</a></div>`;
      }).join('')}</div></div></div>`;
  }

  // ---------- sign-in, account and admin screens ----------
  function renderLogin(msg){
    const root=document.getElementById('root');
    root.setAttribute('data-theme',theme);
    root.innerHTML=`<div class="sheet"><div class="hdr"><h1>Ledger</h1></div>
      <div class="cfg"><h4>Sign in</h4>
        <p>Use the username and password your administrator gave you.</p>
        <div class="fl"><div class="lbl">Username</div>
          <input id="l_u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"/></div>
        <div class="fl"><div class="lbl">Password</div>
          <input id="l_p" type="password" autocomplete="current-password"/></div>
        <div class="err" id="l_err">${esc(msg||'')}</div>
        <div class="btns"><button id="l_go">Sign in</button></div></div></div>`;
    const go=async()=>{
      const u=document.getElementById('l_u').value, p=document.getElementById('l_p').value;
      const err=document.getElementById('l_err'), btn=document.getElementById('l_go');
      if(!u||!p){ err.textContent='Enter your username and password.'; return; }
      btn.disabled=true; err.textContent='';
      const r=await RPC('login',{username:u,password:p});
      if(!r.ok){ btn.disabled=false; err.textContent=r.msg||'Could not sign in.'; return; }
      token=r.data.token; lsSet(TOKENKEY,token);
      await enter(err);
    };
    document.getElementById('l_go').onclick=go;
    document.getElementById('l_p').onkeydown=e=>{ if(e.key==='Enter') go(); };
  }
  async function enter(errEl){
    try{ await load(); }
    catch(r){
      if(r&&r.code==='AUTH') return;
      const m=(r&&r.msg)||'Could not load your ledger.';
      if(errEl) errEl.textContent=m; else renderLogin(m);
      if(!errEl) token=null;
      return;
    }
    sel=today(); tab='home'; mode=null; draft={}; editId=null; panel=null;
    if(db.setup.floor>0) await save();
    render();
  }

  function panelSheet(){
    if(panel==='att') return attSheet();
    if(panel==='acct'){
      return `<div class="ovl" id="ovlp"><div class="card">
        <div class="ph"><span>Account</span><button class="xx" id="p_x">✕</button></div>
        <p class="bkp">Signed in as <b>${esc(me.name)}</b> (${esc(me.username)}). Changing your password signs you out on every other device.</p>
        <div class="pform">
          <input id="a_cur" type="password" placeholder="Current password" autocomplete="current-password"/>
          <input id="a_new" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"/>
          <input id="a_new2" type="password" placeholder="Repeat new password" autocomplete="new-password"/>
        </div>
        <div class="bkrow"><button class="save good" id="a_go">Change password</button></div>
        <div class="hint" id="a_msg">${esc(panelErr)}</div></div></div>`;
    }
    if(panel==='users'){
      const rows=(usersList||[]).map(u=>`<div class="urow${u.active?'':' off'}">
          <div class="un"><b>${esc(u.name)}</b><small>${esc(u.username)}${u.role==='admin'?' · admin':''}${u.active?'':' · disabled'}</small></div>
          <div class="ub">${u.id===me.id?'':`<button data-uview="${esc(u.id)}">View ledger</button>`}
            <button data-ures="${esc(u.id)}">Reset password</button>
            ${u.id===me.id?'':`<button data-uact="${esc(u.id)}" data-on="${u.active?'0':'1'}">${u.active?'Disable':'Enable'}</button>`}</div></div>`).join('');
      return `<div class="ovl" id="ovlp"><div class="card">
        <div class="ph"><span>Users</span><button class="xx" id="p_x">✕</button></div>
        <p class="bkp">Everyone's ledger is private to them. <b style="color:var(--chalk);display:inline">View ledger</b> opens it for
          you to read — every view is recorded in the <button class="linkb" id="u_audit">audit log</button>.</p>
        ${newCred?`<div class="cred"><div class="lbl">${esc(newCred.label)}</div>
          <div class="credv">${esc(newCred.username)} &nbsp;/&nbsp; ${esc(newCred.password)}</div>
          <div class="hint">Shown once. Copy it now and send it to the user privately.</div></div>`:''}
        ${usersList?rows:'<div class="hint" style="padding:0 16px">Loading…</div>'}
        <div class="pform">
          <div class="lbl">Add a user</div>
          <input id="u_name" placeholder="Display name"/>
          <input id="u_user" placeholder="username (letters, digits . _ -)" autocapitalize="none" autocorrect="off" spellcheck="false"/>
        </div>
        <div class="bkrow"><button class="save good" id="u_add">Create user</button></div>
        <div class="hint" id="u_msg">${esc(panelErr)}</div></div></div>`;
    }
    if(panel==='audit'){
      const rows=(auditList||[]).map(r=>`<div class="arow">
        <div class="d">${esc(new Date(r.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))}</div>
        <div class="t"><b>${esc(r.admin)}</b> ${esc(r.action)}${r.target&&r.target!==r.admin?' — '+esc(r.target):''}</div></div>`).join('');
      return `<div class="ovl" id="ovlp"><div class="card">
        <div class="ph"><span>Audit log</span><button class="xx" id="p_x">✕</button></div>
        <p class="bkp">Every admin action — viewing a ledger, creating a user, resetting a password — appended here, oldest action never edited.</p>
        ${auditList?(rows||'<div class="hint" style="padding:0 16px">Nothing yet.</div>'):'<div class="hint" style="padding:0 16px">Loading…</div>'}
        </div></div>`;
    }
    return '';
  }
  async function openUsers(){
    panel='users'; panelErr=''; newCred=null; usersList=null; render();
    const r=await RPC('listUsers');
    if(panel!=='users') return;
    if(r.ok) usersList=r.data; else panelErr=r.msg||'Could not load users.';
    render();
  }
  async function openAudit(){
    panel='audit'; auditList=null; render();
    const r=await RPC('listAudit');
    if(panel!=='audit') return;
    if(r.ok) auditList=r.data;
    render();
  }

  // ---------- admin: read-only "view as" ----------
  async function enterViewAs(u){
    panel=null; panelErr='';
    const r=await RPC('adminLoad',{userId:u.id});
    if(!r.ok){ panelErr=r.msg||'Could not open that ledger.'; panel='users'; render(); return; }
    myDb=db; myMe=me; myRev=rev; mySaved=saved;              // park the admin's own ledger
    viewAs={id:u.id,username:u.username,name:u.name};
    const raw=r.data.doc||{};
    saved={entries:new Map(),meta:''};                       // never diffed against — RO never saves
    rev=r.data.rev; me=r.data.user;
    normalize(raw);
    sel=today(); tab='home'; mode=null; draft={}; editId=null;
    render(); window.scrollTo(0,0);
  }
  function exitViewAs(){
    viewAs=null; db=myDb; me=myMe; rev=myRev; saved=mySaved;
    myDb=null; myMe=null; mySaved=null;
    sel=today(); tab='home'; mode=null; draft={}; editId=null;
    render(); window.scrollTo(0,0);
  }

  // ---------- engine (monthly-envelope model) ----------
  const floorS=()=>db.setup.floor;
  const bufTarget=()=>db.setup.floor*db.setup.bufferMonths;
  const monthKey=k=>k.slice(0,7);                                  // 'YYYY-MM'
  const firstOfMonth=(y,m)=>y+'-'+String(m).padStart(2,'0')+'-01';

  // Spend cascades: Personal first, then Buffer, then Vault. Returns nothing; mutates bk.
  function drawDown(bk, amt, from){
    const order=['personal','buffer','vault'];
    const start=Math.max(0, order.indexOf(from||'personal'));   // unset/'personal' -> unchanged behavior;
    const taken=[];                                              // {bucket,amt} — what actually came from where
    for(let i=start;i<order.length;i++){                        // 'buffer'/'vault' -> skip higher-priority buckets
      const k=order[i];
      if(amt<=0) break;
      const t=Math.min(amt, Math.max(0, bk[k]));
      if(t>0){ bk[k]-=t; amt-=t; taken.push({bucket:k, amt:t}); }
    }
    if(amt>0){ bk.vault-=amt; taken.push({bucket:'vault', amt}); amt=0; }   // overspend drives Vault negative (visible)
    return taken;
  }
  // New reserves (earned, repaid-to-buffer/vault) stack Buffer up to target, then Vault. Never Personal.
  function addReserve(bk, amt, toBucket){
    if(toBucket==='vault'){ bk.vault+=amt; return; }
    if(toBucket==='personal'){ bk.personal+=amt; return; }         // only used by repay-to-origin
    const room=Math.max(0, bufTarget()-bk.buffer);
    const t=Math.min(amt, room); bk.buffer+=t; amt-=t;
    bk.vault+=amt;
  }
  // The bucket a new spend/loan should default to: the first one with real room, Personal→Buffer→Vault.
  // Once Personal is drained for the month, new entries default to Buffer instead of an exhausted Personal.
  function defaultBucket(st){
    return ['personal','buffer','vault'].find(k=>st.buckets[k]>0) || 'personal';
  }

  // Build the list of month-1st boundaries strictly AFTER the migration anchor, up to today.
  function refillDates(){
    const anchor=db.setup.envStart;                               // 'YYYY-MM-DD' when the envelope began
    if(!anchor) return [];
    const out=[]; const t0=fromKey(anchor), tNow=fromKey(today());
    let d=new Date(t0); d=new Date(d.getFullYear(), d.getMonth(), 1);
    // step to the first 1st AFTER the anchor month
    d=new Date(d.getFullYear(), d.getMonth()+1, 1);
    while(d.getTime()<=tNow){
      out.push(firstOfMonth(d.getFullYear(), d.getMonth()+1));
      d=new Date(d.getFullYear(), d.getMonth()+1, 1);
    }
    return out;
  }

  function state(){
    const acc={}; ACCOUNTS.forEach(a=>acc[a]=db.setup.opening[a]||0);
    const bk={personal:0,buffer:0,vault:0,lent:0,borrowed:0};
    // per-person: signed net balance, plus a FIFO stack of outstanding loan lots {amt,from}
    const bal={}, lots={};
    db.people.forEach(x=>{
      bal[x.id]=x.opening||0;
      lots[x.id]=[];
      if((x.opening||0)>0) lots[x.id].push({amt:x.opening, from:x.originBucket||'buffer'});  // opening loans -> buffer on repay
    });
    const owed=()=>db.people.reduce((s,x)=>s+Math.max(0,-(bal[x.id]||0)),0);
    const lent=()=>db.people.reduce((s,x)=>s+Math.max(0, (bal[x.id]||0)),0);
    const savings=[];                                             // {month, amt} roll-over history

    // ----- migration anchor: one fresh Personal envelope, rest to Buffer->Vault -----
    const openCash=ACCOUNTS.reduce((s,a)=>s+(db.setup.opening[a]||0),0);
    const openLent=lent();
    // Seed spendable buckets from CASH ONLY. Opening lent-out money is represented by bk.lent
    // separately — folding it in here too would double-count it (breaks assets===buckets).
    if(db.setup.envStart){
      bk.personal=Math.min(floorS(), openCash);
      let rest=openCash-bk.personal;
      addReserve(bk, Math.max(0,rest), 'buffer');
    }else if(openCash>0){
      bk.personal=openCash;                                       // pre-setup fallback
    }
    bk.lent=openLent;

    // ----- merge entries and month-boundary refills into one ordered timeline -----
    const evs=db.entries.map(e=>({k:e.day, ts:e.ts||0, e}));
    for(const rd of refillDates()) evs.push({k:rd, ts:-1, refill:true});   // refills fire before same-day entries
    evs.sort((a,b)=> a.k<b.k?-1 : a.k>b.k?1 : (a.ts-b.ts));

    for(const ev of evs){
      if(ev.refill){
        // 1) roll leftover Personal up into Buffer, recorded as this month's saving
        const leftover=Math.max(0, bk.personal);
        if(leftover>0){ bk.buffer+=leftover; savings.push({month:monthKey(shift(ev.k,-1)), amt:leftover}); }
        bk.personal=0;
        // 2) refill Personal to cap by DRAWING DOWN reserves (Buffer, then Vault).
        //    This re-designates existing money as the month's allowance — it never creates money,
        //    so assets===buckets stays true. If reserves are short, Personal fills only as far as they reach.
        let need=floorS();
        for(const src of ['buffer','vault']){
          if(need<=0) break;
          const t=Math.min(need, Math.max(0, bk[src]));
          bk[src]-=t; bk.personal+=t; need-=t;
        }
        // if reserves were exhausted, Personal is below cap — honest: you don't have a full month
        continue;
      }
      const e=ev.e;
      if(e.type==='in'){ acc[e.acct]=(acc[e.acct]||0)+e.amt; addReserve(bk, e.amt, 'buffer'); }
      else if(e.type==='out'){ acc[e.acct]=(acc[e.acct]||0)-e.amt; drawDown(bk, e.amt, e.bucket); }
      else if(e.type==='xfer'){ acc[e.from]=(acc[e.from]||0)-e.amt; acc[e.to]=(acc[e.to]||0)+e.amt; }
      else if(e.type==='pin'){                                    // money IN from a person
        const b=bal[e.person]||0;
        const collect=Math.min(e.amt, Math.max(0,b));             // they pay back what they owed you
        const borrow=e.amt-collect;                               // remainder is new borrowing
        acc[e.acct]=(acc[e.acct]||0)+e.amt;
        // return collected money to the bucket(s) it was lent from, newest lots first
        let rem=collect; const st=lots[e.person]||[];
        while(rem>0 && st.length){
          const lot=st[st.length-1];
          const t=Math.min(rem, lot.amt);
          addReserve(bk, t, lot.from==='personal'?'personal':(lot.from==='vault'?'vault':'buffer'));
          lot.amt-=t; rem-=t; if(lot.amt<=1e-9) st.pop();
        }
        if(rem>0) addReserve(bk, rem, 'buffer');                  // safety: unmatched -> buffer
        bk.borrowed+=borrow;
        bk.lent-=collect;
        bal[e.person]=b-e.amt;
      }
      else if(e.type==='pout'){                                   // money OUT to a person
        const b=bal[e.person]||0;
        const repay=Math.min(e.amt, Math.max(0,-b));              // pay down what you owe them
        const give=e.amt-repay;                                   // remainder is a new loan you make
        acc[e.acct]=(acc[e.acct]||0)-e.amt;
        if(repay>0) drawDown(bk, repay);                          // repaying a debt spends from your buckets
        if(give>0){
          const from=e.lendFrom||'personal';
          const taken=drawDown(bk, give, from);                  // cascades Personal→Buffer→Vault, same
                                                                   // protection spending already had
          bk.lent+=give;
          const st=(lots[e.person]||(lots[e.person]=[]));
          taken.forEach(t=>st.push({amt:t.amt, from:t.bucket}));  // one lot per bucket actually drawn from,
        }                                                         // so a cascaded loan still repays correctly
        bal[e.person]=b+e.amt;
      }
      // Transaction fee: real money lost to a payment channel, on top of whatever the entry itself
      // already did above. Applied uniformly and independently, so none of the type-specific logic
      // above needs to know fees exist — this can never double-count or interact with category math.
      if(e.fee>0){
        const feeAcct=(e.type==='xfer')?e.from:e.acct;
        if(feeAcct) acc[feeAcct]=(acc[feeAcct]||0)-e.fee;
        drawDown(bk, e.fee, e.bucket||e.lendFrom||'personal');
      }
    }
    const cash=ACCOUNTS.reduce((s,a)=>s+acc[a],0);
    const lentOut=lent(), youOwe=owed();
    const assets=cash+lentOut;
    const bkTotal=bk.personal+bk.buffer+bk.vault+bk.lent+bk.borrowed;
    const yours=Math.max(0,Math.min(bk.personal,cash));
    const onLoan=Math.max(0,Math.min(bk.borrowed,cash-yours));
    const canPay=Math.max(0,cash);
    return {accounts:acc,buckets:bk,people:bal,cash,lentOut,youOwe,assets,bkTotal,savings,
            yours,onLoan,canPay,reachable:yours,netWorth:assets-youOwe};
  }
  // income/repay now land in reserves; preview shows Buffer/Vault split (no Personal, no waterfall)
  const preview=a=>{const st=state();const bk={...st.buckets};const before=bk.buffer+0;
    addReserve(bk,a,'buffer');return {personal:0,payoff:0,buffer:bk.buffer-st.buckets.buffer,vault:bk.vault-st.buckets.vault};};
  function splitOut(st,person,a){ const b=st.people[person]||0;
    const repay=Math.min(a,Math.max(0,-b)); return {repay,lend:a-repay,before:b,after:b+a}; }
  function splitIn(st,person,a){ const b=st.people[person]||0;
    const collect=Math.min(a,Math.max(0,b)); return {collect,borrow:a-collect,before:b,after:b-a}; }

  // ---------- helpers ----------
  const on=k=>db.entries.filter(e=>e.day===k);
  const outOn=k=>on(k).filter(e=>e.type==='out').reduce((s,e)=>s+e.amt,0);
  const inOn=k=>on(k).filter(e=>e.type==='in').reduce((s,e)=>s+e.amt,0);
  const logged=k=>on(k).length>0||db.zero.indexOf(k)>=0;
  function blankPastDays(){
    const f=firstDay(); if(!f) return [];
    const out=[]; const t=today();
    let d=f;
    while(d<t){                                   // strictly before today (today may still be in progress)
      if(!logged(d)) out.push(d);
      d=shift(d,1);
    }
    return out;
  }
  const hasFloor=()=>db.setup.floor>0;
  const pName=id=>{const x=db.people.find(y=>y.id===id);return x?x.name:'someone';};
  function firstDay(){const ks=db.entries.map(e=>e.day).concat(db.zero).sort();return ks.length?ks[0]:null;}
  function coverage(){
    const f=firstDay(); if(!f) return {span:0,cov:0,pct:0};
    const span=Math.max(1,Math.round((fromKey(today())-fromKey(f))/DAY)+1);
    let cov=0; for(let i=0;i<span;i++) if(logged(shift(f,i))) cov++;
    return {span,cov,pct:Math.round((cov/span)*100)};
  }
  const byCat=l=>{const m={};l.filter(e=>e.type==='out').forEach(e=>m[e.tag]=(m[e.tag]||0)+e.amt);
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const byGroup=l=>{const m={Essential:0,Discretionary:0,Work:0};
    l.filter(e=>e.type==='out').forEach(e=>m[GROUP_OF[e.tag]||'Discretionary']+=e.amt);return m;};

  // Aggregate the whole log into per-month rows: spending by group, earned income, and gap.
  // Personal-line = Essential (living), plus Discretionary and Work shown separately.
  function monthlyRollup(){
    const M={};                                     // 'YYYY-MM' -> {ess,disc,work,earned,big,fee,personalOut}
    const touch=m=>{ if(!M[m]) M[m]={ess:0,disc:0,work:0,earned:0,big:null,fee:0,personalOut:0}; return M[m]; };
    for(const e of db.entries){
      const m=e.day.slice(0,7);
      if(e.type==='out'){
        const g=GROUP_OF[e.tag]||'Discretionary';
        const row=touch(m);
        if(g==='Essential') row.ess+=e.amt;
        else if(g==='Work') row.work+=e.amt;
        else row.disc+=e.amt;
        if(!row.big||e.amt>row.big.amt) row.big={amt:e.amt,tag:e.tag,note:e.note||''};
        if((e.bucket||'personal')==='personal') row.personalOut+=e.amt;
      }else if(e.type==='in'){ touch(m).earned+=e.amt; }
      else if(e.type==='pout' && e.lendFrom==='personal'){ touch(m).personalOut+=e.amt; }
      if(e.fee>0) touch(m).fee+=e.fee;               // fees ride on any type — tracked independently of category
    }
    const months=Object.keys(M).sort();
    return months.map(m=>{
      const r=M[m]; const spent=r.ess+r.disc+r.work; const net=r.earned-spent;
      return {month:m, ess:r.ess, disc:r.disc, work:r.work, spent, earned:r.earned, net, big:r.big, fee:r.fee,
        personalOut:r.personalOut};
    });
  }
  function yearlyRollup(rows){
    const Y={};
    for(const r of rows){
      const y=r.month.slice(0,4);
      if(!Y[y]) Y[y]={year:y,ess:0,disc:0,work:0,spent:0,earned:0,net:0,months:0,fee:0};
      const a=Y[y]; a.ess+=r.ess; a.disc+=r.disc; a.work+=r.work; a.spent+=r.spent;
      a.earned+=r.earned; a.net+=r.net; a.months++; a.fee+=r.fee;
    }
    return Object.values(Y).sort((a,b)=>a.year<b.year?1:-1);   // newest first
  }
  const MONTHNAME=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mLabel=m=>MONTHNAME[parseInt(m.slice(5,7),10)-1]+" "+m.slice(0,4);

  // ---------- shell ----------
  function backupSheet(){
    if(!showBackup) return '';
    const text=JSON.stringify(db);
    return `<div class="ovl" id="ovl">
      <div class="card">
        <div class="ph"><span>Backup</span><button class="xx" id="bk_x">✕</button></div>
        <p class="bkp">This is your whole ledger as text. <b>Copy it</b> and keep it somewhere safe —
          a note to yourself, a message, an email draft. Pasting it back under Restore rebuilds everything.
          No file, no download warning.</p>
        <textarea class="bkta" id="bk_text" readonly>${esc(text)}</textarea>
        <div class="bkrow">
          <button class="save" id="bk_copy">Copy to clipboard</button>
          <button class="save ghost2" id="bk_file">Save as file instead</button>
        </div>
        <div class="hint" id="bk_msg">${text.length.toLocaleString()} characters</div>
      </div></div>`;
  }
  function restoreSheet(){
    if(!showRestore) return '';
    return `<div class="ovl" id="ovlr">
      <div class="card">
        <div class="ph"><span>Restore</span><button class="xx" id="rs_x">✕</button></div>
        <p class="bkp">Paste a backup below and tap Restore — or pick a saved <em>.json</em> file.
          This <b>replaces</b> everything currently in the ledger.</p>
        <textarea class="bkta" id="rs_text" placeholder="Paste your backup text here…"></textarea>
        <div class="bkrow">
          <button class="save good" id="rs_go">Restore from text</button>
          <button class="save ghost2" id="rs_file">Pick a file instead</button>
        </div>
        <div class="hint" id="rs_msg"></div>
      </div></div>`;
  }
  function render(){
    if(!db||!me) return;                       // signed out while an async save/refresh was in flight
    const st=state();
    const daily=hasFloor()?db.setup.floor/30.4:0;
    const runway=daily>0?Math.floor(st.yours/daily):null;
    const bDays=daily>0?Math.floor(st.onLoan/daily):0;
    const root=document.getElementById('root');
    root.setAttribute('data-theme',theme);
    root.innerHTML=`
      <div class="sheet${animate?' anim':''}">
        <div class="hdr"><h1>Ledger</h1>
          <div class="hdrR">
            <div class="lbl">${esc(me.name)} · ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div>
            <button class="themeb" id="theme">${theme==='viewport'?'Vellum':'Viewport'}</button>
          </div></div>
        <div class="nav">${[['home','home'],['day','day'],['review','review'],['year','year'],['plan','plan']].map(([t,lbl])=>
          `<button class="${tab===t?'on':''}" data-t="${t}">${lbl}</button>`).join('')}</div>
        ${viewAs?`<div class="alarm" style="border-color:var(--blue)">
          <b style="color:var(--blue)">Read-only — viewing ${esc(viewAs.name)}'s ledger</b>
          You are signed in as admin, looking at another user's data. Nothing here can be changed or added.
          This view was just recorded in the audit log.
          <button class="act backAdminBtn" style="margin-top:9px">Back to my ledger</button></div>`:''}
        ${(!RO()&&backupDue())?`<div class="alarm" style="border-color:var(--ochre)">
          <b style="color:var(--ochre)">Back this up</b>
          ${db.lastBackup?`It has been ${Math.floor((Date.now()-db.lastBackup)/86400000)} day(s) since your last backup.`
            :`You have ${db.entries.length} entries and no backup yet.`}
          Your ledger is stored on the server, but keep your own copy too — a backup file is
          your protection against a mistaken restore or erase.
          <button class="act" id="baknow" style="margin-top:9px">Back up now</button></div>`:''}
        ${(!RO()&&!saveOk)?`<div class="alarm"><b>Not saved</b>
          The server could not be reached, so your latest changes exist only on this screen. They are kept and
          re-sent with your next save — don't close this page yet.

        ${RO()&&!hasFloor()?`<div class="cfg"><h4>No data yet</h4><p>This user has not completed their setup.</p></div>`
          :(!RO()&&(!hasFloor()||editing))?cfgPanel():''}
        ${tab==='home'?viewHome(st,daily,runway,bDays):tab==='day'?viewDay(st,daily,runway,bDays):tab==='review'?viewReview(st):tab==='year'?viewYear(st):viewPlan(st)}
        <div class="tools">
          <button id="exp">Export CSV</button>${RO()?`<button class="backAdminBtn">Back to my ledger</button>`:`
          <button id="bak">Backup (JSON)</button>
          <button id="imp">Restore</button><button id="edit">Settings &amp; people</button>
          <button id="acct">Account</button>${me.role==='admin'?'<button id="usr">Users</button>':''}
          <button id="out">Log out</button>
          <button id="reset" class="danger">Erase all</button>`}
          <input type="file" id="impf" accept="application/json,.json" style="display:none"/></div>
      </div>
      <div class="tblock">
        <div class="cell"><div class="lbl">Your runway</div>
          <div class="v ${runway===null?'mute':(runway<7?'warn':'')}">${runway===null?'—':runway+'d'}${
            bDays>0?`<span style="color:var(--ochre);font-weight:400"> +${bDays}</span>`:''}</div></div>
        <div class="cell"><div class="lbl">Can pay with</div>
          <div class="v">${fmt(st.canPay)}</div></div>
        <div class="cell"><div class="lbl">Owe</div>
          <div class="v ${st.youOwe>0?'warn':'mute'}">${fmt(st.youOwe)}</div></div>
        <div class="cell"><div class="lbl">Net worth</div>
          <div class="v ${st.netWorth<0?'warn':'pos'}">${fmtS(st.netWorth)}</div></div>
      </div>
      ${backupSheet()}${restoreSheet()}${panelSheet()}`;
    wire();
    // centre the day rail on the selected day so past days are reachable without a Today round-trip
    const rail=document.getElementById('rail');
    if(rail){

      if(selCol){

        rail.scrollLeft=Math.max(0,target);
      }else{ rail.scrollLeft=rail.scrollWidth; }
    }
    animate=true;
  }

  function openCfg(){
    cfg={ floor: db.setup.floor?String(Math.round(db.setup.floor/S)):'',
          bm: String(db.setup.bufferMonths),
          opening: Object.fromEntries(ACCOUNTS.map(a=>[a, db.setup.opening[a]?String(Math.round(db.setup.opening[a]/S)):''])),
          people: db.people.map(x=>({id:x.id,name:x.name,mag:Math.abs(x.opening||0),neg:(x.opening||0)<0})) };

  function cfgPanel(){
