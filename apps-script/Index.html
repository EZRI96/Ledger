    const s=cfg;

      <h4>${hasFloor()?'Settings &amp; people':'Two things to start'}</h4>

        :'What does your life cost to run in a normal month? A rough guess is fine — the daily log will correct it. Then what you hold, and who you owe or who owes you.'}</p>

  // ================= DAY =================
  // HOME: read-only overview, always "today". Summary panels live here, not on Day.
  // Net-worth composition ring: On hand + Lent out fill the ring; Owed is drawn as a red
  // bite taken out of it — literally a piece missing from what would otherwise be whole.
  // Two concentric rings, drawn synchronously as SVG arc paths (innerHTML won't run <script>,
  // so this must compute geometry in plain JS, same pattern as the rest of this file's SVGs).
  function arcPath(cx,cy,R,a0,a1,color,width){
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    return `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"
      fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
  }
  function ringSegs(cx,cy,R,width,parts,gapDeg){
    const total=parts.reduce((s,p)=>s+Math.max(0,p.v),0)||1;
    const gapRad=gapDeg*Math.PI/180;
    const visible=parts.filter(p=>p.v>0);
    const availAngle=2*Math.PI-gapRad*visible.length;
    let angle=-Math.PI/2, out='';
    visible.forEach(p=>{
      const sweep=availAngle*(p.v/total);
      out+=arcPath(cx,cy,R,angle,angle+sweep,p.color,width);
      angle+=sweep+gapRad;
    });
    return out;
  }
  function ringChart(st){
    const cx=110, cy=110;
    const outer=ringSegs(cx,cy,92,14,[
      {v:st.buckets.personal,color:'var(--blue)'},
      {v:st.buckets.buffer,  color:'var(--reserve)'},
      {v:st.buckets.vault,   color:'var(--green)'},
    ],4);
    const inner=ringSegs(cx,cy,68,14,[
      {v:st.cash,    color:'var(--liquidity)'},
      {v:st.lentOut, color:'var(--ochre)'},
      {v:st.youOwe,  color:'var(--red)'},
    ],5);
    return `<svg viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Money composition">
        <circle cx="${cx}" cy="${cy}" r="92" fill="none" stroke="var(--edge)" stroke-width="14"/>
        <circle cx="${cx}" cy="${cy}" r="68" fill="none" stroke="var(--edge)" stroke-width="14"/>
        ${outer}${inner}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="21"
          font-weight="700" fill="${st.netWorth<0?'var(--red)':'var(--chalk)'}">${fmtS(st.netWorth)}</text>
        <text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5"
          letter-spacing="1.8" fill="var(--faint)">NET WORTH</text>
      </svg>`;
  }
  // Keys sit BELOW the ring (not beside it) — stacked, not side-by-side, so nothing overflows on a phone.
  function ringKeys(st){
    return `<div class="keys">
      <div class="keycol">
        <div class="kh">Outer · What it's for</div>
        <div class="kx"><i style="background:var(--blue)"></i>Personal<b>${fmt(st.buckets.personal)}</b></div>
        <div class="kx"><i style="background:var(--reserve)"></i>Buffer<b>${fmt(st.buckets.buffer)}</b></div>
        <div class="kx"><i style="background:var(--green)"></i>Vault<b>${fmt(st.buckets.vault)}</b></div>
      </div>
      <div class="keycol">
        <div class="kh">Inner · Composition</div>
        <div class="kx"><i style="background:var(--liquidity)"></i>On hand<b>${fmt(st.cash)}</b></div>
        <div class="kx"><i style="background:var(--ochre)"></i>Owed to you<b>${fmt(st.lentOut)}</b></div>
        ${st.youOwe>0?`<div class="kx"><i style="background:var(--red)"></i>Owed by you<b>${fmt(st.youOwe)}</b></div>`:''}
      </div>
    </div>`;
  }
  // A slim proportional bar: [[label,value,color], ...] sized to their own total.
  // Renders a neutral empty track (not nothing) when there is no money yet, so the
  // feature is visible even on a fresh install.
  function allocBar(parts){
    const total=parts.reduce((s,p)=>s+Math.max(0,p[1]),0);
    if(total<=0) return `<div class="alloc"><div class="aseg empty" style="width:100%" title="Nothing logged yet"></div></div>`;
    return `<div class="alloc">${parts.filter(p=>p[1]>0).map(p=>
      `<div class="aseg" style="width:${(p[1]/total*100).toFixed(2)}%;background:${p[2]}" title="${esc(p[0])} · ${fmt(p[1])}"></div>`
    ).join('')}</div>`;
  }

  function viewHome(st,daily,runway,bDays){
    const neg=ACCOUNTS.filter(a=>st.accounts[a]<0);
    const hasMoney=st.cash+st.lentOut+st.youOwe>0;
    const pbv=st.buckets.personal+st.buckets.buffer+st.buckets.vault;   // Personal+Buffer+Vault only —
                                                                          // lent/borrowed live in the ring, not here
    const oweList=db.people.map(x=>({name:x.name,b:st.people[x.id]||0})).filter(x=>x.b<0)
      .map(x=>({name:x.name,amt:-x.b})).sort((a,b)=>b.amt-a.amt);
    const owedList=db.people.map(x=>({name:x.name,b:st.people[x.id]||0})).filter(x=>x.b>0)
      .sort((a,b)=>b.b-a.b);
    const chip=(x,cls,amt)=>`<div class="achip"><div class="av" style="border-color:var(--${cls});color:var(--${cls})">${esc(x.name.slice(0,2))}</div>
      <div class="nm">${esc(x.name)}</div><div class="am" style="color:var(--${cls})">${fmt(amt)}</div></div>`;
    return `
      ${hasFloor()?`<div class="heroline">
        <div class="n">${runway===null?'—':runway}${bDays>0?`<span style="color:var(--ochre);font-size:.4em;font-weight:600"> +${bDays}</span>`:''}</div>
        <div class="c">Days of spending left</div>
      </div>`:''}

      <div class="ringzone">${ringChart(st)}</div>
      ${ringKeys(st)}
      ${hasMoney?'':`<div class="ringempty">Nothing logged yet — set your floor and log a day to see this fill in.</div>`}

      <div class="tblk">
        <div><div class="lbl">Yours</div><div class="v blue">${fmt(st.yours)}</div></div>
        <div><div class="lbl">Can pay</div><div class="v liq">${fmt(st.canPay)}</div></div>
        <div><div class="lbl">Owe</div><div class="v alert">${fmt(st.youOwe)}</div></div>
        <div><div class="lbl">Owed</div><div class="v warm">${fmt(st.lentOut)}</div></div>
      </div>

      ${st.onLoan>0?`<div class="alarm" style="border-color:var(--ochre)">
        <b style="color:var(--ochre)">Borrowed money is buying you time, not money</b>
        You hold ${fmt(st.canPay)}, but only ${fmt(st.yours)} of it is yours. The other ${fmt(st.onLoan)} buys roughly
        <b style="color:var(--chalk);display:inline">${bDays} extra day${bDays===1?'':'s'}</b> — and every one of those days
        costs you net worth. That is what borrowing actually is: <em>days now, worth later.</em></div>`:''}

      ${st.buckets.personal>st.cash&&st.cash>=0?`<div class="alarm"><b>Worth more than you can spend</b>
        Your Personal bucket holds ${fmt(st.buckets.personal)}, but only ${fmt(st.cash)} is within reach —
        the rest is out with someone. You are not poor. You are <em>illiquid</em>, which feels identical at the shop.</div>`:''}

      ${neg.length?`<div class="alarm"><b>Something is missing</b>
        ${neg.map(esc).join(' and ')} ${neg.length>1?'are':'is'} negative — you've spent more from
        ${neg.length>1?'them':'it'} than ${neg.length>1?'they':'it'} held. A transfer or a loan probably wasn't logged.</div>`:''}

      <!-- WHERE IT IS — solid liquidity edge: 100% one concept, no lent-out row (that lives in the ring) -->
      <div class="legend liq">
        <div class="lh">
          <svg width="15" height="15" viewBox="0 0 16 16"><rect x="1" y="4" width="14" height="10" rx="1.5" fill="none" stroke="var(--liquidity)" stroke-width="1.2"/><circle cx="11" cy="9" r="1.2" fill="var(--liquidity)"/></svg>
          <div class="t">Where it is</div>
        </div>
        ${allocBar([['Cash',Math.max(0,st.accounts.Cash),'color-mix(in srgb, var(--liquidity) 100%, transparent)'],
                    ['telebirr',Math.max(0,st.accounts.telebirr),'color-mix(in srgb, var(--liquidity) 68%, transparent)'],
                    ['Bank',Math.max(0,st.accounts.Bank),'color-mix(in srgb, var(--liquidity) 40%, transparent)']])}
        ${ACCOUNTS.map(a=>`<div class="row"><span>${a}</span>
          <span class="v ${st.accounts[a]<0?'neg':''}">${fmtS(st.accounts[a])}</span></div>`).join('')}
        <div class="row tot"><span>Assets</span><span class="v">${fmtS(st.cash)}</span></div>
      </div>

      <!-- WHAT IT'S FOR — mixed edge: 3 stacked colors proportional to Personal/Buffer/Vault only -->
      <div class="legend mix">
        <div class="mixedge">
          <div style="flex:${pbv>0?Math.max(0,st.buckets.personal)/pbv:0} 0 0%;background:var(--blue)"></div>
          <div style="flex:${pbv>0?Math.max(0,st.buckets.buffer)/pbv:0} 0 0%;background:var(--reserve)"></div>
          <div style="flex:${pbv>0?Math.max(0,st.buckets.vault)/pbv:1} 0 0%;background:var(--green)"></div>
        </div>
        <div class="lh">
          <svg width="15" height="15" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="14" rx="1.5" fill="none" stroke="var(--graphite)" stroke-width="1.2"/><line x1="4" y1="6" x2="12" y2="6" stroke="var(--graphite)" stroke-width="1"/><line x1="4" y1="10" x2="12" y2="10" stroke="var(--graphite)" stroke-width="1"/></svg>
          <div class="t">What it's for</div>
        </div>
        ${allocBar([['Personal',Math.max(0,st.buckets.personal),'var(--blue)'],
                    ['Buffer',Math.max(0,st.buckets.buffer),'var(--reserve)'],
                    ['Vault',Math.max(0,st.buckets.vault),'var(--green)']])}
        <div class="row"><span>Personal${floorS()?' · cap '+fmt(floorS()):''}</span><span class="v">${fmtS(st.buckets.personal)}</span></div>
        <div class="row"><span>Buffer${bufTarget()?' · target '+fmt(bufTarget()):''}</span><span class="v">${fmtS(st.buckets.buffer)}</span></div>
        <div class="row"><span>Vault</span><span class="v">${fmtS(st.buckets.vault)}</span></div>
        <div class="row tot"><span>Total</span><span class="v">${fmtS(pbv)}</span></div>
      </div>

      ${oweList.length?`<div class="peoplewrap">
        <div class="peoplehead"><span class="t" style="color:var(--red)">You owe</span><span class="v" style="color:var(--red)">${fmt(st.youOwe)}</span></div>
        <div class="prow">${oweList.map(x=>chip(x,'red',x.amt)).join('')}</div>
      </div>`:''}
      ${owedList.length?`<div class="peoplewrap">
        <div class="peoplehead"><span class="t" style="color:var(--ochre)">Owed to you</span><span class="v" style="color:var(--ochre)">${fmt(st.lentOut)}</span></div>
        <div class="prow">${owedList.map(x=>chip(x,'ochre',x.b)).join('')}</div>
      </div>`:''}`;
  }

  // DAY: pure logging, date-navigable. No summary panels.
  function viewDay(st,daily,runway,bDays){
    const k=sel, isToday=k===today(), isFuture=fromKey(k)>fromKey(today());
    const list=on(k).slice().sort((a,x)=>(x.ts||0)-(a.ts||0));
    const spent=outOn(k), got=inOn(k), left=daily-spent, over=left<0;
    const isZero=db.zero.indexOf(k)>=0;

    return `
      ${(()=>{if(RO()) return '';
        const bp=blankPastDays();return bp.length?`<div class="alarm" style="border-color:var(--chalk)">
        <b style="color:var(--chalk)">${bp.length} blank day${bp.length===1?'':'s'} before today</b>
        These days have nothing logged — they are holes, not zeros. If a day was genuinely no-spend, mark it so the
        Plan tab counts it. Only do this for days you are sure about.
        <button class="act" id="fillzero" style="margin-top:9px">Mark all ${bp.length} as no-spend</button>
        <button class="act" id="gofirst" style="margin-top:9px;margin-left:6px">Go to oldest</button></div>`:'';})()}

      ${dayRail(st)}

      <div class="grid4">
        <div class="cel"><div class="lbl">Spent</div><div class="v out">${fmt(spent)}</div></div>
        <div class="cel"><div class="lbl">Allowance</div>
          <div class="v ${daily?'':'mute'}" style="${daily?'color:var(--faint)':''}">${daily?fmt(daily):'—'}</div></div>
        <div class="cel"><div class="lbl">${over&&daily?'Over by':'Left'}</div>
          <div class="v ${daily?(over?'neg':'pos'):'mute'}">${daily?fmt(Math.abs(left)):'—'}</div></div>
        <div class="cel"><div class="lbl">Earned</div><div class="v ${got?'in':'mute'}">${fmt(got)}</div></div>
      </div>

      <div class="cap-row">
        <button class="big inflow ${mode==='in'?'on':''}" id="m_in" ${isFuture||RO()?'disabled':''}>+ Earned</button>
        <button class="big xfer ${mode==='xfer'?'on':''}" id="m_xf" ${isFuture||RO()?'disabled':''}>⇄ Transfer</button>
        <button class="big outflow ${mode==='out'?'on':''}" id="m_out" ${isFuture||RO()?'disabled':''}>− Spent</button>
      </div>
      <div class="cap-row2">
        <button class="sm ${mode==='pin'?'on':''}" id="m_pi" ${isFuture||RO()?'disabled':''}>⊕ From a person</button>
        <button class="sm ${mode==='pout'?'on':''}" id="m_po" ${isFuture||RO()?'disabled':''}>⊖ To a person</button>
      </div>

      ${mode&&!RO()?formHTML(st):(RO()?'':frequentHTML())}

      ${spent?`<div class="sec"><h3><span>Essential vs choice</span><em>${fmt(spent)}</em></h3>
        ${groupBars(byGroup(on(k)),spent)}</div>`:''}

      <div class="sec"><h3><span>Entries</span><em>${list.length}</em></h3>
        ${list.length?list.map(rowHTML).join(''):
          isZero?`<div class="zbadge"><span>✓ No-spend day recorded</span>${RO()?'':'<button id="unzero">Undo</button>'}</div>`
                :`<div class="empty">Nothing logged for this day.<br/>A blank day and a zero day are not the same thing.</div>
                  ${(!isFuture&&!RO())?`<button class="zbtn" id="zero">Mark this as a no-spend day</button>`:''}`}
      </div>`;
  }


  function peopleRow(st,from,to){
    const inP = db.entries.filter(e=>e.type==='pin' &&(!from||(e.day>=from&&e.day<=to))).reduce((a,e)=>a+e.amt,0);
    const outP= db.entries.filter(e=>e.type==='pout'&&(!from||(e.day>=from&&e.day<=to))).reduce((a,e)=>a+e.amt,0);
    const net = st.lentOut - st.youOwe;
    return `<div class="grid4" style="margin-bottom:${pplView?'1px':'22px'}">
      <button class="cel tap ${pplView==='owe'?'open':''}" data-ppl="owe">
        <div class="lbl">You owe ${st.youOwe>0?'▾':''}</div>
        <div class="v ${st.youOwe>0?'neg':'mute'}">${fmt(st.youOwe)}</div></button>
      <button class="cel tap ${pplView==='owed'?'open':''}" data-ppl="owed">
        <div class="lbl">They owe you ${st.lentOut>0?'▾':''}</div>
        <div class="v ${st.lentOut>0?'pos':'mute'}">${fmt(st.lentOut)}</div></button>
      <div class="cel"><div class="lbl">Net with people</div>
        <div class="v ${net===0?'mute':(net>0?'pos':'neg')}">${fmtS(net)}</div></div>
      <div class="cel"><div class="lbl">Moved ${from?'this period':'today'}</div>
        <div class="v ${(inP||outP)?'':'mute'}" style="${(inP||outP)?'color:var(--ochre)':''}">${
          (inP||outP)?`+${fmt(inP)} / −${fmt(outP)}`:'0'}</div></div>
    </div>${pplList(st)}`;
  }

  // Every balance below is the person's opening position plus every
  // "From a person" (pin) minus... no — plus/minus every entry that names them:
  //   pin  (money came from them)  ->  balance falls (you owe more / they owe you less)
  //   pout (money went to them)    ->  balance rises (they owe you more / you owe less)
  // Positive balance = they owe you. Negative = you owe them.
  function pplList(st){
    if(!pplView) return '';
    const isOwe = pplView==='owe';
    const rows = db.people
      .map(x=>({name:x.name, b:st.people[x.id]||0}))
      .filter(x=> isOwe ? x.b<0 : x.b>0)
      .map(x=>({name:x.name, amt:Math.abs(x.b)}))
      .sort((a,b)=>b.amt-a.amt);
    const total = rows.reduce((s,x)=>s+x.amt,0);
    return `<div class="panel ppl" style="margin-bottom:22px">
      <div class="ph"><span>${isOwe?'Everyone you owe':'Everyone who owes you'}</span>
        <span>${rows.length} name${rows.length===1?'':'s'} · ${fmt(total)}</span></div>
      ${rows.length?rows.map(x=>`<div class="pr"><div class="k">${esc(x.name)}
          <small>${isOwe?'You owe':'Owes you'}</small></div>
          <div class="v ${isOwe?'neg':'pos'}">${fmt(x.amt)}</div></div>`).join('')
        :`<div class="pr"><div class="k sub">${isOwe?'You owe nobody.':'Nobody owes you.'}</div>
           <div class="v mute">0</div></div>`}
      ${rows.length?`<div class="pr tot"><div class="k">Total</div>
        <div class="v ${isOwe?'neg':'pos'}">${fmt(total)}</div></div>`:''}
    </div>`;
  }

  function dayRail(st){
    const k=sel, isToday=k===today();
    const d=new Date(fromKey(k));
    // full history: first logged day (or 13 days back, whichever earlier) .. today
    const f=firstDay();
    // rail spans from the EARLIEST of: first logged day, the selected day, or 13 days back — up to today
    let startT=fromKey(shift(today(),-13));
    if(f) startT=Math.min(startT, fromKey(f));
    startT=Math.min(startT, fromKey(sel));
    const days=[]; let t=startT, end=fromKey(today());
    while(t<=end){ const kk=key(t); days.push({k:kk, v:outOn(kk), has:logged(kk)}); t+=DAY; }
    let max=1; days.forEach(x=>{ if(x.v>max) max=x.v; });

    return `<div class="railwrap">
      <div class="dnav">
        <button class="arw" id="prev" aria-label="Previous day">‹</button>
        <div class="mid"><div class="dd">${d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div>
          <div class="dw">${isToday?'Today':d.toLocaleDateString('en-GB',{weekday:'long'})}</div></div>
        <button class="arw" id="next" aria-label="Next day" ${isToday?'disabled':''}>›</button>
        ${!isToday?`<button class="todaybtn" id="jt">Today</button>`:''}
      </div>
      <div class="rail" id="rail">
        ${days.map(x=>{const mk=x.k.slice(5); // MM-DD
          const dd=new Date(fromKey(x.k));
          const wd=dd.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2);
          const h=x.has&&x.v>0?Math.max(6,(x.v/max)*100):0;
          return `<button class="railcol ${x.k===k?'sel':''}" data-day="${x.k}" title="${x.k} · ${fmt(x.v)}">
            <div class="railbar"><div class="b ${!x.has?'gap':(x.v===0?'zero':'')}" style="height:${h}%"></div></div>
            <div class="rd">${x.k.slice(8)}</div>
            <div class="rw">${x.k===today()?'TODAY':wd}</div>
          </button>`;}).join('')}
      </div>
    </div>`;
  }

  function frequentHTML(){
    if(fromKey(sel)>fromKey(today())) return '';
    const cut=Date.now()-45*DAY, m={};
    db.entries.filter(e=>e.type==='out'&&fromKey(e.day)>cut).forEach(e=>{
      const kk=e.tag+'|'+e.amt+'|'+e.acct; m[kk]=(m[kk]||0)+1;});
    const top=Object.entries(m).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(!top.length) return '';
    return `<div class="quick"><div class="lbl">Repeat — one tap</div><div class="qchips">
      ${top.map(x=>{const p=x[0].split('|');
        return `<button class="qchip" data-rep="${esc(x[0])}">${esc(p[0])} <b>${fmt(+p[1])}</b></button>`;}).join('')}
    </div></div>`;
  }

  function personChips(){
    const isNew=draft.person==='__new';
    return `<div class="grp"><div class="gname">Who</div><div class="chips">
      ${db.people.map(x=>`<button class="chip ${draft.person===x.id?'on':''}" data-per="${x.id}">${esc(x.name)}</button>`).join('')}
      <button class="chip ${isNew?'on':''}" data-per="__new">+ New</button></div>
      ${isNew?`<div class="newp"><input id="p_new" type="text" placeholder="Their name" value="${esc(draft.pName||'')}"/></div>`:''}
    </div>`;
  }

  function feeField(){
    return `<input class="fee" id="fee" type="number" inputmode="decimal"
      placeholder="Transaction fee (optional)" value="${draft.fee||''}"/>`;
  }
  function editBanner(){
    if(!editId) return '';
    const e=db.entries.find(v=>v.id===editId); if(!e) return '';
    return `<div class="lbl" style="margin-bottom:12px;color:var(--blue)">✎ Editing the entry from ${esc(e.day)} — saving replaces it</div>`;
  }
  function formHTML(st){
    const amt=parseFloat(draft.amt||0), aS=toS(amt);
    const isNew=draft.person==='__new';
    const personOk=isNew?!!(draft.pName&&draft.pName.trim()):!!draft.person;

    if(mode==='xfer'){
      const ready=amt>0&&draft.from&&draft.to&&draft.from!==draft.to;
      const miss=[]; if(!(amt>0))miss.push('amount'); if(!draft.from)miss.push('from'); if(!draft.to)miss.push('to');
      return `<div class="form">
        ${editBanner()}
        <input class="amt" id="amt" type="number" inputmode="decimal" placeholder="0" value="${draft.amt||''}"/>
        <div class="lbl" style="margin-top:6px">Birr · ${esc(sel)} · money you already have</div>
        <div class="grp"><div class="gname">From</div><div class="chips">
          ${ACCOUNTS.map(o=>`<button class="chip ${draft.from===o?'on':''}" data-from="${o}">${o}</button>`).join('')}</div></div>
        <div class="grp"><div class="gname">To</div><div class="chips">
          ${ACCOUNTS.map(o=>`<button class="chip ${draft.to===o?'on':''}" data-to="${o}" ${draft.from===o?'disabled':''}>${o}</button>`).join('')}</div></div>
        ${feeField()}
        <div class="fall"><div class="r"><span>Counts as income</span><span>No — not new money</span></div>
          <div class="r"><span>Buckets · net worth</span><span>unchanged</span></div></div>
        ${attField()}
        <button class="save" id="rec" ${ready?'':'disabled'}>${editId?'Save changes':'Record transfer'}</button>
        <div class="hint" id="hint">${ready?'':'Still needed: '+miss.join(', ')}</div></div>`;
    }

    if(mode==='pin'){                                     // money IN from a person
      const ready=amt>0&&personOk&&draft.acct;
      const miss=[]; if(!(amt>0))miss.push('amount'); if(!personOk)miss.push('who'); if(!draft.acct)miss.push('account');
      const sp=(!isNew&&draft.person)?splitIn(st,draft.person,aS):{collect:0,borrow:aS,before:0,after:-aS};
      const nm=isNew?(draft.pName||'someone'):pName(draft.person);
      return `<div class="form people">
        ${editBanner()}
        <input class="amt" id="amt" type="number" inputmode="decimal" placeholder="0" value="${draft.amt||''}"/>
        <div class="lbl" style="margin-top:6px">Birr · ${esc(sel)} · money coming from a person</div>
        ${personChips()}
        <div class="grp"><div class="gname">Landed in</div><div class="chips">
          ${ACCOUNTS.map(o=>`<button class="chip ${draft.acct===o?'on':''}" data-acct="${o}">${o}</button>`).join('')}</div></div>
        <div class="fall">
          ${sp.collect>0?`<div class="r"><span>${esc(nm)} paying you back</span><span>${fmt(sp.collect)}</span></div>`:''}
          ${sp.borrow>0?`<div class="r"><span>You borrowing</span><span>${fmt(sp.borrow)}</span></div>`:''}
          <div class="r"><span>Counts as income</span><span>No</span></div>
          <div class="r"><span>Net worth change</span><span>0</span></div></div>
        ${aS>0?`<div class="truth ${sp.borrow>0?'bad':''}">${
          sp.borrow>0
            ? `You will hold <b>${fmt(sp.borrow)}</b> more and owe <b>${fmt(sp.borrow)}</b> more. It does not make you richer — it goes to the <b>Borrowed</b> bucket, not Personal. Your net worth only moves when you <em>spend</em> it, and then it moves down.`
            : `${esc(nm)} is returning your own money. Nothing about your net worth changes — it just comes back into reach.`}</div>`:''}
        ${attField()}
        <button class="save ppl" id="rec" ${ready?'':'disabled'}>${editId?'Save changes':'Record it'}</button>
        <div class="hint" id="hint">${ready?'':'Still needed: '+miss.join(', ')}</div></div>`;
    }

    if(mode==='pout'){                                    // money OUT to a person
      const ready=amt>0&&personOk&&draft.acct;
      const miss=[]; if(!(amt>0))miss.push('amount'); if(!personOk)miss.push('who'); if(!draft.acct)miss.push('account');
      const sp=(!isNew&&draft.person)?splitOut(st,draft.person,aS):{repay:0,lend:aS,before:0,after:aS};
      const nm=isNew?(draft.pName||'someone'):pName(draft.person);
      const lf=draft.lendFrom||defaultBucket(st);
      const daily=hasFloor()?db.setup.floor/30.4:0;
      const rNow=daily>0?Math.floor(st.reachable/daily):null;
      const cashAfter=st.cash-aS;
      const persAfter=st.buckets.personal-(lf==='personal'?sp.lend:0)-Math.min(sp.repay,st.buckets.personal);
      const reachAfter=Math.max(0,Math.min(persAfter,cashAfter));
      const rAfter=daily>0?Math.floor(reachAfter/daily):null;
      const danger=rAfter!==null&&rAfter<7, caution=rAfter!==null&&rAfter<14;
      const srcBal=st.buckets[lf]||0;
      return `<div class="form people">
        ${editBanner()}
        <input class="amt" id="amt" type="number" inputmode="decimal" placeholder="0" value="${draft.amt||''}"/>
        <div class="lbl" style="margin-top:6px">Birr · ${esc(sel)} · money going to a person</div>
        ${personChips()}
        <div class="grp"><div class="gname">Paid from</div><div class="chips">
          ${ACCOUNTS.map(o=>`<button class="chip ${draft.acct===o?'on':''}" data-acct="${o}">${o}${
            st.accounts[o]<aS?' ·'+fmt(st.accounts[o]):''}</button>`).join('')}</div></div>
        ${sp.repay>0?`<div class="grp"><div class="gname">Repayment drawn from</div>
          <div class="lbl" style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px;color:var(--graphite)">
            Cascades automatically: Personal first, then Buffer, then Vault.</div></div>`:''}
        ${sp.lend>0?`<div class="grp"><div class="gname">The loan comes out of</div><div class="chips">
          ${['personal','buffer','vault'].map(b=>{
            const bal=st.buckets[b], empty=bal<=0;
            return `<button class="chip ${lf===b?'on':''}" data-lf="${b}" ${empty?'disabled':''}>${
              BUCKETS.find(x=>x.k===b).n} · ${fmt(bal)}</button>`;
          }).join('')}</div></div>`:''}
        ${feeField()}
        <div class="fall">
          ${sp.repay>0?`<div class="r"><span>Paying ${esc(nm)} back</span><span>${fmt(sp.repay)}</span></div>`:''}
          ${sp.lend>0?`<div class="r"><span>Lending to ${esc(nm)}</span><span>${fmt(sp.lend)}</span></div>`:''}
          <div class="r"><span>Counts as spending</span><span>No</span></div>
          <div class="r"><span>Net worth change</span><span>0 — but see below</span></div>
          ${(aS>0&&rNow!==null)?`<div class="r"><span>Your runway</span>
            <span style="${danger?'color:var(--red)':caution?'color:var(--ochre)':''}">${rNow} days → ${rAfter} days</span></div>`:''}
        </div>
        ${aS>0?`<div class="truth ${danger?'bad':''}">${
          sp.lend>0
            ? (danger
              ? `<b>Stop.</b> This leaves you ${rAfter} day${rAfter===1?'':'s'} of runway. Your net worth won't change —
                 but net worth doesn't buy bread. You would be lending money you need to eat, and you will be back
                 borrowing it within the week. ${sp.lend>srcBal?`You don't even have ${fmt(sp.lend)} in ${BUCKETS.find(x=>x.k===lf).n}.`:''}`
              : caution
              ? `Careful — this drops you to ${rAfter} days of runway. It's still your money, but it is no longer
                 <em>reachable</em> money.`
              : `This is <b>not an expense</b>. ${fmt(sp.lend)} stays yours — it moves to <b>Lent out</b> and stays in your
                 net worth. It becomes a real loss only if ${esc(nm)} never pays it back.${
                 st.youOwe>0?` <br/><br/>Note: you owe ${fmt(st.youOwe)} to others. Lending while you owe is borrowing from one person to fund another.`:''}`)
            : `Paying ${esc(nm)} back. Cash down, debt down — net worth unchanged. You are trading money for freedom.`}</div>`:''}
        ${attField()}
        <button class="save ppl" id="rec" ${ready?'':'disabled'}>Record it</button>
        <div class="hint" id="hint">${ready?'':'Still needed: '+miss.join(', ')}</div></div>`;
    }

    const isIn=mode==='in';
    const ready=amt>0&&draft.tag&&draft.acct;
    const miss=[]; if(!(amt>0))miss.push('amount');
    if(!draft.tag)miss.push(isIn?'source':'category'); if(!draft.acct)miss.push('account');
    const w=isIn?preview(aS):null;
    const bkOpts=BUCKETS.filter(b=>b.k!=='payoff'&&b.k!=='lent'&&(b.k!=='borrowed'||st.buckets.borrowed>0));
    return `<div class="form ${isIn?'earn':'spend'}">
        ${editBanner()}
      <input class="amt" id="amt" type="number" inputmode="decimal" placeholder="0" value="${draft.amt||''}"/>
      <div class="lbl" style="margin-top:6px">Birr · ${esc(sel)}</div>
      ${isIn?`<div class="grp"><div class="gname">Source</div><div class="chips">
          ${INCOME_SRC.map(o=>`<button class="chip ${draft.tag===o?'on':''}" data-tag="${esc(o)}">${esc(o)}</button>`).join('')}
        </div></div>`
       :CATS.map(c=>`<div class="grp"><div class="gname">${c.g}</div><div class="chips">
          ${c.items.map(o=>`<button class="chip ${draft.tag===o?'on':''}" data-tag="${esc(o)}">${esc(o)}</button>`).join('')}
        </div></div>`).join('')}
      <div class="grp"><div class="gname">${isIn?'Landed in':'Paid from'}</div><div class="chips">
        ${ACCOUNTS.map(o=>`<button class="chip ${draft.acct===o?'on':''}" data-acct="${o}">${o}</button>`).join('')}</div></div>
      ${!isIn?`<div class="grp"><div class="gname">Draw from bucket</div><div class="chips">
        ${bkOpts.map(o=>{
          const bal=st.buckets[o.k], empty=bal<=0 && o.k!=='borrowed';
          return `<button class="chip ${(draft.bucket||defaultBucket(st))===o.k?'on':''}"
            data-bk="${o.k}" ${empty?'disabled':''}>${o.n} · ${fmt(bal)}</button>`;
        }).join('')}
      </div></div>`:''}
      ${!isIn?feeField():''}
      <input class="note" id="note" placeholder="Note (optional)" value="${esc(draft.note||'')}"/>
      ${isIn?`<div class="fall">${fallRows(w,st)}</div>`:''}
      ${!isIn&&draft.bucket==='borrowed'?`<div class="truth bad">You are spending borrowed money.
        Your net worth falls by <b>${fmt(aS)}</b> the moment you do — the money goes, the debt stays.</div>`:''}
      ${attField()}
      <button class="save ${isIn?'inflow':'danger'}" id="rec" ${ready?'':'disabled'}>
        ${editId?'Save changes':(isIn?'Record — waterfall it':'Record spend')}</button>
      <div class="hint" id="hint">${ready?'':'Still needed: '+miss.join(', ')}</div></div>`;
  }

  function fallRows(w,st){
    if(!w) w={personal:0,buffer:0,vault:0};
    const order=[['buffer','Buffer — fills to target'],
                 ['vault','Vault — the rest, forever']];
    return '<div class="lbl" style="margin-bottom:6px">Waterfall</div>'+
      order
        .map(o=>`<div class="r ${w[o[0]]?'':'z'}"><span>${o[1]}</span><span>${fmt(w[o[0]])}</span></div>`).join('');
  }

  function rowHTML(e){
    const dt=new Date(fromKey(e.day)).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    const isEd=editId===e.id;
    const na=(e.att||[]).length;
    const ctl=(na?`<button class="attb" data-att="${e.id}" title="Attachments">📎${na>1?na:''}</button>`:'')+
      (RO()?'':`<button class="edt${isEd?' on':''}" data-edit="${e.id}" title="Edit">✎</button>
      <button class="del" data-del="${e.id}" title="Delete">×</button>`);
    const feeTag=e.fee>0?` · <span style="color:var(--red)">fee ${fmt(e.fee)}</span>`:'';
    if(e.type==='xfer') return `<div class="row${isEd?' editing':''}"><div class="d">${dt}</div>
      <div class="t">${esc(e.from)} → ${esc(e.to)}<small>Transfer · not income${feeTag}</small></div>
      <div style="display:flex;align-items:baseline"><div class="a xf">⇄${fmt(e.amt)}</div>${ctl}</div></div>`;
    if(e.type==='pin') return `<div class="row${isEd?' editing':''}"><div class="d">${dt}</div>
      <div class="t">From ${esc(pName(e.person))}<small>${esc(e.acct)} · borrowed or paid back to you${feeTag}</small></div>
      <div style="display:flex;align-items:baseline"><div class="a pp">⊕${fmt(e.amt)}</div>${ctl}</div></div>`;
    if(e.type==='pout') return `<div class="row${isEd?' editing':''}"><div class="d">${dt}</div>
      <div class="t">To ${esc(pName(e.person))}<small>${esc(e.acct)} · lent or paid back${feeTag}</small></div>
      <div style="display:flex;align-items:baseline"><div class="a pp">⊖${fmt(e.amt)}</div>${ctl}</div></div>`;
    const bk=BUCKETS.find(b=>b.k===e.bucket)||BUCKETS[0];
    return `<div class="row${isEd?' editing':''}"><div class="d">${dt}</div>
      <div class="t">${esc(e.note||e.tag)}<small>${esc(e.tag)} · ${esc(e.acct)}${e.type==='out'?' · '+bk.n:''}${feeTag}</small></div>
      <div style="display:flex;align-items:baseline">
        <div class="a ${e.type==='in'?'in':'out'}">${e.type==='in'?'+':'−'}${fmt(e.amt)}</div>${ctl}</div></div>`;
  }

  function groupBars(g,total){
    if(!total) return '';
    return ['Essential','Discretionary','Work'].filter(k=>g[k]>0).map(k=>{
      const pct=Math.round((g[k]/total)*100);
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-size:13px">${k}</div>
          <div class="num" style="font-size:13px;font-weight:600">${fmt(g[k])}
            <span style="color:var(--faint);font-weight:400">· ${pct}%</span></div></div>
        <div class="bar"><i class="${k==='Discretionary'?'disc':(k==='Work'?'work':'')}" style="width:${pct}%"></i></div></div>`;
    }).join('');
  }

  // ================= WEEK =================
  function weekKeys(off){
    const d=new Date(fromKey(today())); d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
    const o=[]; for(let i=0;i<7;i++) o.push(key(d.getTime()+i*DAY)); return o;
  }
  function viewWeek(st){
    const cw=weekKeys(0), pw=weekKeys(-1);
    const cur=db.entries.filter(e=>cw.indexOf(e.day)>=0);
    const prev=db.entries.filter(e=>pw.indexOf(e.day)>=0);
    const out=cur.filter(e=>e.type==='out').reduce((s,e)=>s+e.amt,0);
    const inc=cur.filter(e=>e.type==='in').reduce((s,e)=>s+e.amt,0);
    const fee=cur.reduce((s,e)=>s+(e.fee||0),0);   // fees ride on any transaction type, tracked independently
    const pOut=prev.filter(e=>e.type==='out').reduce((s,e)=>s+e.amt,0);
    const guard=hasFloor()?db.setup.floor/4.35:0, over=guard>0&&out>guard;
    const withinAllowance=guard-out;   // real computation: this week's floor-share minus what actually left
    const delta=pOut>0?Math.round(((out-pOut)/pOut)*100):null;
    const days=cw.map(k=>({k,v:outOn(k),has:logged(k)}));
    let max=1; days.forEach(x=>{if(x.v>max)max=x.v;});
    return `
      <div class="grid3">
        <div class="cel"><div class="lbl">Earned</div><div class="v in">${fmt(inc)}</div></div>
        <div class="cel"><div class="lbl">Spent</div><div class="v out">${fmt(out)}</div></div>
        <div class="cel"><div class="lbl">vs last week</div>
          <div class="v ${delta===null?'mute':(delta>0?'neg':'pos')}">${delta===null?'—':(delta>0?'+':'')+delta+'%'}</div></div>
      </div>
      ${guard>0?`<div class="compare">
        <div class="cside">
          <div class="lbl">Net</div>
          <div class="cv ${inc-out>=0?'growth':'alert'}">${fmtS(inc-out)}</div>
          <div class="cc">Earned minus spent — your total position, this week</div>
        </div>
        <div class="cdiv"></div>
        <div class="cside">
          <div class="lbl">Within allowance</div>
          <div class="cv ${withinAllowance>=0?'allow':'alert'}">${fmtS(withinAllowance)}</div>
          <div class="cc">Guardrail (${fmt(guard)}) minus spent — this week's cap, regardless of income</div>
        </div>
      </div>
      <div class="lbl" style="margin:-4px 0 20px;line-height:1.6">
        These can disagree — a good income week can hide an overspent allowance, and the reverse.</div>`:''}
      ${fee>0?`<div class="lbl" style="margin:0 0 20px;line-height:1.6">
        <span style="color:var(--red)">Fees this week — ${fmt(fee)}</span>, money lost to payment channels, on top of what you spent.</div>`:''}
      ${peopleRow(st,cw[0],cw[6])}
      <div class="sec"><h3><span>Spend by day</span><em>tap to open</em></h3>
        <div class="wk">${days.map(x=>`<button data-day="${x.k}" title="${fmt(x.v)}">
          <div class="b ${x.v===0?'zero':''} ${x.k===today()?'today':''}" style="height:${Math.max(2,(x.v/max)*100)}%"></div>
        </button>`).join('')}</div>
        <div class="wkx">${days.map(x=>`<div class="lbl" style="${x.has?'':'opacity:.35'}">
          ${new Date(fromKey(x.k)).toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)}</div>`).join('')}</div>
        ${guard?`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:18px">
            <div class="lbl">Weekly guardrail</div>
            <div class="num" style="font-size:12px;${over?'color:var(--red);font-weight:600':''}">${fmt(out)} / ${fmt(guard)}</div></div>
          <div class="bar"><i class="${over?'over':''}" style="width:${Math.min(100,(out/guard)*100)}%"></i></div>`
          :`<div class="lbl" style="margin-top:16px">Set your floor to get a weekly guardrail.</div>`}
      </div>
      ${out?`<div class="sec"><h3><span>Essential vs choice</span></h3>${groupBars(byGroup(cur),out)}</div>`:''}
      <div class="sec"><h3><span>This week, line by line</span><em>${cur.length}</em></h3>
        ${cur.length?cur.slice().sort((a,x)=>fromKey(x.day)-fromKey(a.day)||(x.ts||0)-(a.ts||0)).map(rowHTML).join('')
          :`<div class="empty">Nothing logged this week.</div>`}</div>`;
  }

  // ================= MONTH =================
  function viewMonth(st){
    const n=new Date(), y=n.getFullYear(), m=n.getMonth();
    const dim=new Date(y,m+1,0).getDate(), dnow=n.getDate();
    const keys=[]; for(let i=1;i<=dim;i++) keys.push(key(new Date(y,m,i).getTime()));
    const cur=db.entries.filter(e=>keys.indexOf(e.day)>=0);
    const inc=cur.filter(e=>e.type==='in').reduce((s,e)=>s+e.amt,0);
    const out=cur.filter(e=>e.type==='out').reduce((s,e)=>s+e.amt,0);
    const pi=cur.filter(e=>e.type==='pin').reduce((s,e)=>s+e.amt,0);
    const po=cur.filter(e=>e.type==='pout').reduce((s,e)=>s+e.amt,0);
    const fee=cur.reduce((s,e)=>s+(e.fee||0),0);   // fees ride on any transaction type, tracked independently
    const perDay=out/dnow, projected=perDay*dim;
    const rate=inc>0?Math.round(((inc-out)/inc)*100):null;
    const cats=byCat(cur), maxCat=cats.length?cats[0][1]:1;
    const big=cur.filter(e=>e.type==='out').sort((a,b)=>b.amt-a.amt).slice(0,5);
    let maxD=1; keys.slice(0,dnow).forEach(k=>{const v=outOn(k); if(v>maxD) maxD=v;});
    const lead=(new Date(y,m,1).getDay()+6)%7;
    const overFloor=hasFloor()&&projected>db.setup.floor;
    const proratedFloor=hasFloor()?db.setup.floor*dnow/dim:0;
    const withinAllowance=proratedFloor-out;   // real computation: floor-to-date minus spent-to-date
    let pads=''; for(let i=0;i<lead;i++) pads+='<div class="cd pad"></div>';
    return `
      <div class="grid3">
        <div class="cel"><div class="lbl">Earned</div><div class="v in">${fmt(inc)}</div></div>
        <div class="cel"><div class="lbl">Spent</div><div class="v out">${fmt(out)}</div></div>
        <div class="cel"><div class="lbl">Keep rate</div>
          <div class="v ${rate===null?'mute':(rate>=0?'pos':'neg')}">${rate===null?'—':rate+'%'}</div></div>
      </div>
      ${hasFloor()?`<div class="compare">
        <div class="cside">
          <div class="lbl">Kept</div>
          <div class="cv ${inc-out>=0?'growth':'alert'}">${fmtS(inc-out)}</div>
          <div class="cc">Earned minus spent — your total position, this month</div>
        </div>
        <div class="cdiv"></div>
        <div class="cside">
          <div class="lbl">Within allowance</div>
          <div class="cv ${withinAllowance>=0?'allow':'alert'}">${fmtS(withinAllowance)}</div>
          <div class="cc">${dnow}/${dim} of your floor (${fmt(proratedFloor)}) minus spent so far — pacing
            ${withinAllowance>=0?'under':'over'}, independent of income</div>
        </div>
      </div>
      <div class="lbl" style="margin:-4px 0 20px;line-height:1.6">
        These can disagree — a good income month can hide an overspent allowance, and the reverse.</div>`:''}
      ${fee>0?`<div class="lbl" style="margin:0 0 20px;line-height:1.6">
        <span style="color:var(--red)">Fees this month — ${fmt(fee)}</span>, money lost to payment channels, on top of what you spent.</div>`:''}
      ${peopleRow(st,keys[0],keys[keys.length-1])}
      <div class="lbl" style="margin:-12px 0 22px">Borrowing is not earning. Lending is not spending. Both stay out of the numbers above.</div>
      <div class="sec"><h3><span>Pace</span></h3>
        <div style="display:flex;gap:30px;flex-wrap:wrap;margin-bottom:14px">
          <div><div class="lbl">Per day so far</div><div class="num" style="font-size:17px;font-weight:600;margin-top:5px">${fmt(perDay)}</div></div>
          <div><div class="lbl">Heading for</div><div class="num" style="font-size:17px;font-weight:600;margin-top:5px;${overFloor?'color:var(--red)':''}">${fmt(projected)}</div></div>
          <div><div class="lbl">Your floor</div><div class="num" style="font-size:17px;font-weight:600;margin-top:5px;color:var(--faint)">${hasFloor()?fmt(db.setup.floor):'—'}</div></div>
        </div>
        ${hasFloor()?`<div class="bar"><i class="${overFloor?'over':'ok'}" style="width:${Math.min(100,(projected/db.setup.floor)*100)}%"></i></div>`:''}
      </div>
      <div class="sec"><h3><span>The month, day by day</span><em>tap any day</em></h3>
        <div class="calx">${['M','T','W','T','F','S','S'].map(x=>`<div class="lbl">${x}</div>`).join('')}</div>
        <div class="cal">${pads}${keys.map((k,i)=>{
          const v=outOn(k), future=(i+1)>dnow, has=logged(k);
          const a=future?0:(v>0?(0.10+0.68*(v/maxD)):(has?0.06:0));
          return `<div class="cd ${(!future&&!has)?'miss':''}" data-day="${k}"
            style="background:rgba(22,24,26,${a.toFixed(2)});${future?'opacity:.4':''}"
            title="${k} · ${future?'—':fmt(v)}"><span>${i+1}</span></div>`;}).join('')}</div>
        <div class="lbl" style="margin-top:8px">Dashed = never logged. Those days are holes in your plan.</div>
      </div>
      ${out?`<div class="sec"><h3><span>Essential vs choice</span></h3>${groupBars(byGroup(cur),out)}</div>`:''}
      ${cats.length?`<div class="sec"><h3><span>Where it went</span></h3>
        ${cats.map(c=>`<div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div style="font-size:13px">${esc(c[0])}</div>
            <div class="num" style="font-size:13px;font-weight:600">${fmt(c[1])}</div></div>
          <div class="bar"><i class="${GROUP_OF[c[0]]==='Discretionary'?'disc':(GROUP_OF[c[0]]==='Work'?'work':'')}" style="width:${(c[1]/maxCat)*100}%"></i></div>
        </div>`).join('')}</div>`:''}
      ${big.length?`<div class="sec"><h3><span>Biggest five</span></h3>${big.map(rowHTML).join('')}</div>`:''}
      ${!cur.length?`<div class="empty">No entries this month yet.</div>`:''}`;
  }

  // ================= PLAN =================
  function viewReview(st){
    const sel=reviewMode;
    return `
      <div class="revbar">
        <button class="revtab ${sel==='week'?'on':''}" data-rev="week">Week</button>
        <button class="revtab ${sel==='month'?'on':''}" data-rev="month">Month</button>
      </div>
      ${sel==='week'?viewWeek(st):viewMonth(st)}`;
  }

  function viewYear(st){
    const rows=monthlyRollup();
    if(!rows.length){
      return `<div class="empty">No months to summarise yet.<br/>Log a few days and this fills in.</div>`;
    }
    const years=yearlyRollup(rows).slice(0,5);          // keep at most 5 years, newest first
    const byYear={};
    rows.forEach(r=>{ const y=r.month.slice(0,4); (byYear[y]||(byYear[y]=[])).push(r); });

    // scale bars against the biggest single-month spend across everything shown
    let mx=1; rows.forEach(r=>{ if(r.spent>mx)mx=r.spent; if(r.earned>mx)mx=r.earned; });
    const kept=rows.filter(r=>r.net>0).length, over=rows.filter(r=>r.net<0).length;

    const monthCard=r=>{
      const w=v=>Math.max(0,Math.round((v/mx)*100));
      const saved=r.net>=0;
      const extra=[];
      if(r.big) extra.push(`Biggest: <b>${esc(r.big.note||r.big.tag)}</b>${r.big.note?` <span class="mut">(${esc(r.big.tag)})</span>`:''} — <span class="amt">${fmt(r.big.amt)}</span>`);
      if(r.fee>0) extra.push(`Fees this month — <span class="amt" style="color:var(--red)">${fmt(r.fee)}</span>`);
      if(hasFloor()){
        const d=r.personalOut-floorS(), over=d>0;
        extra.push(`Personal cap — <span class="amt" style="color:${over?'var(--red)':'var(--green)'}">${
          over?fmt(d)+' over':fmt(Math.abs(d))+' under'}</span>`);
      }
      return `<div class="ym">
        <div class="ymh"><div class="ymname">${mLabel(r.month)}</div>
          <div class="ymnet ${saved?'pos':'neg'}">${saved?'saved ':'over '}${fmt(Math.abs(r.net))}</div></div>
        <div class="ymgrid">
          <div class="yl">Earned</div>   <div class="yb"><i class="ern" style="width:${w(r.earned)}%"></i></div><div class="yv in">${fmt(r.earned)}</div>
          <div class="yl">Spent</div>    <div class="yb"><i class="spt" style="width:${w(r.spent)}%"></i></div><div class="yv out">${fmt(r.spent)}</div>
          <div class="yl sub">· Personal</div><div class="yb"><i class="ess" style="width:${w(r.ess)}%"></i></div><div class="yv">${fmt(r.ess)}</div>
          <div class="yl sub">· Choice</div>  <div class="yb"><i class="dsc" style="width:${w(r.disc)}%"></i></div><div class="yv">${fmt(r.disc)}</div>
          <div class="yl sub">· Work</div>    <div class="yb"><i class="wrk" style="width:${w(r.work)}%"></i></div><div class="yv">${fmt(r.work)}</div>
        </div>
        ${extra.map((l,i)=>`<div class="ymbig" style="${i>0?'border-top:0;padding-top:2px':''}">${l}</div>`).join('')}
      </div>`;
    };

    return `
      <div class="conf"><span class="tagx">Year view</span> — every month you have logged, grouped by year.
        Newest first. ${rows.length} month${rows.length===1?'':'s'} recorded ·
        <b>${kept}</b> in surplus, <b>${over}</b> over. Money to and from people is excluded — this is
        earning vs spending only.</div>

      ${years.map(y=>{
        const ms=(byYear[y.year]||[]).slice().sort((a,b)=>a.month<b.month?1:-1);   // newest month first
        const saved=y.net>=0;
        const keepRate=y.earned>0?Math.round((y.net/y.earned)*100):null;
        return `<div class="sec">
          <div class="yh"><div class="yr">${y.year}</div><div class="tag2 ${saved?'saved':'over'}">${saved?'saved ':'over '}${fmt(Math.abs(y.net))}</div></div>
          <div class="ytot">
            <div class="ycell"><div class="lbl">Earned</div><div class="v in">${fmt(y.earned)}</div></div>
            <div class="ycell"><div class="lbl">Spent</div><div class="v out">${fmt(y.spent)}</div></div>
            <div class="ycell"><div class="lbl">${saved?'Saved':'Over'}</div><div class="v ${saved?'pos':'neg'}">${fmt(Math.abs(y.net))}</div></div>
            <div class="ycell"><div class="lbl">Keep rate</div><div class="v ${keepRate===null?'mute':(keepRate>=0?'pos':'neg')}">${keepRate===null?'—':keepRate+'%'}</div></div>
          </div>
          <div class="ybreak"><div class="lbl">Year split</div>
            <div class=" br"><span>Personal</span><span class="num">${fmt(y.ess)}</span></div>
            <div class="br"><span>Choice</span><span class="num">${fmt(y.disc)}</span></div>
            <div class="br"><span>Work</span><span class="num">${fmt(y.work)}</span></div>
            ${y.fee>0?`<div class="br"><span style="color:var(--red)">Fees</span><span class="num" style="color:var(--red)">${fmt(y.fee)}</span></div>`:''}
          </div>
          ${ms.map(monthCard).join('')}
        </div>`;
      }).join('')}

      ${yearlyRollup(rows).length>5?`<div class="conf" style="margin-top:6px">Showing the most recent 5 years.
        Older years are summarised in your data but hidden here.</div>`:''}`;
  }

  function viewPlan(st){
    const c=coverage();
    const outs=db.entries.filter(e=>e.type==='out');
    const ins=db.entries.filter(e=>e.type==='in');

    if(c.cov<7){
      return `<div class="conf bad"><span class="tagx">Not ready</span><br/>
        This page is arithmetic on your daily log and nothing else. It needs <b>7 logged days</b> before it will speak.
        <br/><br/>Logged so far: <b>${c.cov} day${c.cov===1?'':'s'}</b>. Use the ‹ › arrows on the Day tab to fill in
        past days from bank SMS and receipts.</div>`;
    }

    const conf=(c.pct>=85&&c.span>=45)?'Reliable':(c.pct>=70&&c.span>=21)?'Working':'Provisional';
    const thin=c.pct<70;
    const life=outs.filter(e=>GROUP_OF[e.tag]!=='Work').reduce((s,e)=>s+e.amt,0);
    const realDaily=life/c.cov, realMonthly=realDaily*30.4;
    const stated=db.setup.floor, gap=realMonthly-stated;
    const totalOut=outs.reduce((s,e)=>s+e.amt,0);
    const g=byGroup(outs);
    const discPct=totalOut>0?Math.round((g.Discretionary/totalOut)*100):0;
    const totalIn=ins.reduce((s,e)=>s+e.amt,0);
    const monthlyIn=totalIn/(c.span/30.4);
    const surplus=monthlyIn-realMonthly;
    const bT=bufTarget();
    const bufPct=bT>0?Math.min(100,Math.round((st.buckets.buffer/bT)*100)):0;

    const owe=db.people.map(x=>({...x,b:st.people[x.id]||0})).filter(x=>x.b<0)
      .map(x=>({...x,amt:-x.b})).sort((a,b)=>a.amt-b.amt);
    const lent=db.people.map(x=>({...x,b:st.people[x.id]||0})).filter(x=>x.b>0)
      .sort((a,b)=>b.b-a.b);
    const monthsToClear=surplus>0&&st.youOwe>0?Math.ceil(st.youOwe/surplus):null;
    const owedMonths=monthlyIn>0?(st.youOwe/monthlyIn):null;
    const unspent=st.buckets.borrowed;
    const cats=byCat(outs), topCat=cats[0];
    const cut20=topCat?Math.round((topCat[1]/c.cov)*365*0.2):0;

    return `
      <div class="conf ${thin?'bad':''}">
        <span class="tagx">${conf}</span> — from <b>${c.cov} logged days</b> of ${c.span} (${c.pct}% coverage),
        ${db.entries.length} entries. Money to and from people is excluded from income and spending.
        ${thin?'<br/><br/>Coverage under 70%. Unlogged days drag these numbers <b>down</b> — your real cost is likely higher than shown.':''}
      </div>

      <div class="plan ${st.netWorth<0?'alert':'good'}">
        <div class="h"><div class="k">Net worth — what you are worth</div>
          <div class="n ${st.netWorth<0?'rev':'ok'}">${fmtS(st.netWorth)}</div></div>
        <p>${fmtS(st.cash)} in pocket${st.lentOut?`, ${fmt(st.lentOut)} lent out`:''}${st.youOwe?`, ${fmt(st.youOwe)} owed`:''}.
          ${st.netWorth<0?'You owe more than you own. Until this crosses zero, nothing else here matters.'
            :st.youOwe?'Positive — but not everything in your hand is yours.'
            :'You owe nobody. Everything you hold is yours.'}</p>
      </div>

      <div class="plan ${st.reachable<realMonthly/4?'alert':''}">
        <div class="h"><div class="k">Spendable — what you can actually pay with</div>
          <div class="n ${st.reachable<realMonthly/4?'rev':'dim'}">${fmt(st.reachable)}</div></div>
        <p>${st.lentOut>0
          ? `You are <b>worth ${fmtS(st.netWorth)}</b> but can only <b>reach ${fmt(st.reachable)}</b>. The gap is money lent out and money already committed elsewhere. These are two different questions, and confusing them is how people with money on paper end up borrowing for groceries.`
          : `Personal money within reach. Net worth answers "am I solvent". This answers "can I eat this week". Never use the first to decide the second.`}
          ${st.reachable<realMonthly/4?`<br/><br/><b>This is under a week of living costs.</b>${st.lentOut>0?` Collect what is owed to you before you touch the Buffer.`:''}`:''}</p>
      </div>

      ${owe.length?`
      <div class="plan alert">
        <div class="h"><div class="k">You owe</div><div class="n rev">${fmt(st.youOwe)}</div></div>
        <div style="margin-top:11px">${owe.map((x,i)=>`<div class="ord">
          <div><span class="rk">${i+1}</span>${esc(x.name)}</div>
          <div class="rt owe">${fmt(x.amt)}</div></div>`).join('')}</div>
        <p>${owedMonths!==null?`That is <b>${owedMonths.toFixed(1)} months</b> of your income. `:''}
          Clear the smallest first. There's no interest, so no arithmetic picks the order — what matters is getting
          names <em>off the list</em>. Each one cleared is a person you can go back to. That is the only credit line you have.
          ${unspent>0?`<br/><br/><b>${fmt(unspent)} of borrowed money is still unspent.</b> Hand it straight back — held onto, it quietly becomes groceries.`:''}</p>
      </div>
      <div class="plan">
        <div class="h"><div class="k">Clear of debt in</div>
          <div class="n ${monthsToClear!==null?'dim':'rev'}">${monthsToClear!==null?monthsToClear+' mo':'never'}</div></div>
        <p>${monthsToClear!==null
          ? `At your current overflow of ~<b>${fmt(surplus)}/month</b>, everything you owe is gone in <b>${monthsToClear} month${monthsToClear===1?'':'s'}</b> — provided you don't borrow again in between.`
          : `Your income doesn't yet cover your spending, so <b>nothing</b> is going to repayment. You are on course to borrow again. Fix this before anything else on this page is worth reading.`}</p>
      </div>`:''}

      ${lent.length?`
      <div class="plan warm">
        <div class="h"><div class="k">Owed to you</div><div class="n warm">${fmt(st.lentOut)}</div></div>
        <div style="margin-top:11px">${lent.map((x,i)=>`<div class="ord">
          <div><span class="rk">${i+1}</span>${esc(x.name)}</div>
          <div class="rt owed">${fmt(x.b)}</div></div>`).join('')}</div>
        <p>This is <b>your money</b>, counted in your net worth — but you cannot spend it, and it earns you nothing.
          ${st.lentOut>realMonthly?`It is more than a month of your living costs sitting outside your reach. `:''}
          ${st.youOwe>0?`You owe ${fmt(st.youOwe)} while ${fmt(st.lentOut)} is out with others. Collect before you borrow again.`
            :`Ask for it back before you dip into Buffer — that is what it is there to prevent.`}</p>
      </div>`:''}

      <div class="plan ${stated>0&&gap>0?'alert':'good'}">
        <div class="h"><div class="k">What your life actually costs</div>
          <div class="n ${stated>0&&gap>0?'rev':'ok'}">${fmt(realMonthly)}<span style="font-size:11px;color:var(--faint)">/mo</span></div></div>
        <p>${stated<=0?'Measured from your log.'
          :gap>0?`<b>${fmt(gap)} more</b> than the ${fmt(stated)} floor you set. The waterfall is filling Personal to the wrong level.`
                :`<b>${fmt(-gap)} under</b> the floor you set.`}
          Real daily burn ${fmt(realDaily)}; work costs excluded.</p>
        ${Math.abs(gap)>stated*0.05?`<button class="act" id="setfloor" data-v="${Math.round(realMonthly)}">Set floor to ${fmt(realMonthly)}</button>`:''}
      </div>

      <div class="plan allow">
        <div class="h"><div class="k">Pay yourself this, twice a month</div>
          <div class="n dim">${fmt(realMonthly*1.1/2)}<span style="font-size:11px;color:var(--faint)"> ×2</span></div></div>
        <p>${fmt(realMonthly*1.1)} a month — your real cost plus 10% headroom — moved out of Personal on the 1st and
          the 15th. Fixed. Not "what's left". Lumpy income only becomes livable when the withdrawal stops being lumpy
          too, and the waterfall already caps Personal at your floor so the extra never reaches your hand.</p>
      </div>

      <div class="plan ${bufPct>=100?'good':''}">
        <div class="h"><div class="k">Buffer — ${db.setup.bufferMonths} months of survival</div>
          <div class="n ${bufPct>=100?'ok':''}">${fmt(st.buckets.buffer)}<span style="font-size:12px;color:var(--faint)"> / ${fmt(bT)}</span></div></div>
        <div class="bar" style="margin-top:9px"><i style="width:${bufPct}%"></i></div>
        <p>One month goes in first, before any repayment — without it, the next bad week just becomes another loan.
          After that, what you owe comes first, then the rest of the buffer.
          ${surplus>0?`~${fmt(surplus)} overflows each month.`:'Nothing is overflowing yet.'}</p>
      </div>

      <div class="plan ${discPct>30?'alert':''}">
        <div class="h"><div class="k">Choice vs necessity</div><div class="n ${discPct>30?'rev':''}">${discPct}%</div></div>
        <div class="bar" style="margin-top:9px"><i class="disc" style="width:${discPct}%"></i></div>
        <p>${discPct>30?`Above 30% is where project-income earners get caught — it doesn't shrink when the work stops. This is the cuttable money${owe.length?', and it is what clears the list fastest':''}.`
          :'Disciplined. Your problem is on the income side, not lifestyle.'}</p>
      </div>

      ${topCat?`<div class="plan"><div class="h"><div class="k">Biggest line: ${esc(topCat[0])}</div>
        <div class="n">${fmt(cut20)}<span style="font-size:11px;color:var(--faint)">/yr</span></div></div>
        <p>Cut it by one fifth and you free <b>${fmt(cut20)} a year</b>.</p></div>`:''}

      <div class="plan ${owe.length?'':'good'}">
        <div class="h"><div class="k">Vault</div>
          <div class="n ${owe.length?'rev':'ok'}">${owe.length?'On hold':fmt(st.buckets.vault)}</div></div>
        <p>${owe.length
          ? `You owe ${fmt(st.youOwe)}. Building a Vault while people are waiting to be paid back isn't wealth — it's money sitting next to an obligation. The waterfall sends the overflow to Payoff instead. The Vault opens the day the list is empty.`
          : `Once the Buffer is full, move the Vault into 91-day treasury bills (minimum 5,000 birr, around ${TBILL}%) rather than a savings account — cash in a savings account loses to inflation every month it sits there.`}</p>
      </div>`;
  }

  // ---------- events ----------
  function wire(){
    const $=id=>document.getElementById(id);
    document.querySelectorAll('.nav button').forEach(x=>{x.onclick=()=>{tab=x.dataset.t;mode=null;editId=null;pplView=null;render();};});
    document.querySelectorAll('[data-rev]').forEach(x=>{x.onclick=()=>{ reviewMode=x.dataset.rev; animate=true; render(); };});
    document.querySelectorAll('[data-day]').forEach(x=>{x.onclick=()=>{sel=x.dataset.day;tab='day';mode=null;editId=null;render();};});

    if($('c_addp')) $('c_addp').onclick=()=>{ syncCfg(); cfg.people.push({id:uid(),name:'',mag:0,neg:true}); render(); };
    document.querySelectorAll('[data-px]').forEach(x=>{x.onclick=()=>{ syncCfg(); cfg.people.splice(+x.dataset.px,1); render(); };});
    document.querySelectorAll('[data-pd]').forEach(x=>{x.onclick=()=>{ syncCfg();
      const i=+x.dataset.pd; cfg.people[i].neg=!cfg.people[i].neg; render(); };});
    if($('c_save')) $('c_save').onclick=async()=>{
      syncCfg();
      const f=parseFloat(cfg.floor), bm=parseInt(cfg.bm,10);
      if(isNaN(f)||f<=0){ cfgErr='Enter your monthly personal cost — a number greater than 0.'; render(); return; }
      if(isNaN(bm)||bm<1||bm>24){ cfgErr='Buffer target must be between 1 and 24 months.'; render(); return; }
      const op={};
      for(const a of ACCOUNTS){
        const raw=cfg.opening[a]===''?0:parseFloat(cfg.opening[a]);
        if(isNaN(raw)||raw<0){ cfgErr='Balances must be 0 or more.'; render(); return; }
        op[a]=Math.round(raw*S);
      }
      for(const x of cfg.people){ if(!String(x.name||'').trim()){ cfgErr='Every person needs a name.'; render(); return; } }
      const prevEnv=db.setup.envStart;
      db.setup={floor:Math.round(f*S),bufferMonths:bm,opening:op,
                envStart: prevEnv || today()};              // stamp envelope start on first save
      db.people=cfg.people.map(x=>{
        const was=db.people.find(y=>y.id===x.id);
        const opening=x.neg?-x.mag:x.mag;
        return {id:x.id,name:String(x.name).trim(),opening,
                originBucket: opening>0 ? (was&&was.originBucket ? was.originBucket : 'buffer') : undefined};
      });
      cfgErr=''; editing=false; cfg=null; await save(); render();
    };
    if($('c_cancel')) $('c_cancel').onclick=()=>{ editing=false; cfgErr=''; cfg=null; render(); };
    if($('setfloor')) $('setfloor').onclick=async()=>{ db.setup.floor=parseInt($('setfloor').dataset.v,10); await save(); render(); };

    if($('prev')) $('prev').onclick=()=>{sel=shift(sel,-1);mode=null;render();};
    if($('next')) $('next').onclick=()=>{if(sel!==today()){sel=shift(sel,1);mode=null;render();}};
    if($('jt'))   $('jt').onclick=()=>{sel=today();mode=null;render();};

    if($('m_in'))  $('m_in').onclick =()=>{editId=null; mode=(mode==='in')?null:'in';   draft={acct:'Bank'};focusAmt=!!mode;render();};
    if($('m_out')) $('m_out').onclick=()=>{editId=null; mode=(mode==='out')?null:'out'; draft={acct:'Cash',bucket:defaultBucket(state())};focusAmt=!!mode;render();};
    if($('m_xf'))  $('m_xf').onclick =()=>{editId=null; mode=(mode==='xfer')?null:'xfer';draft={from:'Bank',to:'telebirr'};focusAmt=!!mode;render();};
    if($('m_pi'))  $('m_pi').onclick =()=>{editId=null; mode=(mode==='pin')?null:'pin';
      draft={acct:'Cash',person:db.people.length?db.people[0].id:'__new'};focusAmt=!!mode;render();};
    if($('m_po'))  $('m_po').onclick =()=>{editId=null; mode=(mode==='pout')?null:'pout';
      draft={acct:'Cash',lendFrom:defaultBucket(state()),person:db.people.length?db.people[0].id:'__new'};focusAmt=!!mode;render();};

    if($('zero'))   $('zero').onclick=async()=>{if(db.zero.indexOf(sel)<0)db.zero.push(sel);await save();render();};
    if($('gofirst')) $('gofirst').onclick=()=>{ const bp=blankPastDays(); if(bp.length){ sel=bp[0]; mode=null; editId=null; render(); window.scrollTo(0,0);} };
    if($('fillzero')) $('fillzero').onclick=async()=>{
      const bp=blankPastDays();
      if(!bp.length) return;
      if(!confirm('Mark all '+bp.length+' blank day(s) before today as no-spend? Do this only for days you are sure had zero spending.')) return;
      for(const dkey of bp){ if(db.zero.indexOf(dkey)<0) db.zero.push(dkey); }
      await save(); render();
    };
    if($('unzero')) $('unzero').onclick=async()=>{db.zero=db.zero.filter(z=>z!==sel);await save();render();};

    document.querySelectorAll('[data-rep]').forEach(x=>{x.onclick=async()=>{
      const p=x.dataset.rep.split('|');
      db.zero=db.zero.filter(z=>z!==sel);
      db.entries.push({id:uid(),day:sel,ts:Date.now(),type:'out',amt:parseInt(p[1],10),tag:p[0],acct:p[2],bucket:defaultBucket(state()),note:''});
      await save(); render();};});

    const amt=$('amt');
    if(amt){
      amt.oninput=()=>{draft.amt=amt.value; animate=false; focusAmt=true; render();};
      if(focusAmt){
        amt.focus();
        const v=amt.value; amt.value=''; amt.value=v;
        focusAmt=false;
      }
      if($('note'))  $('note').oninput=e=>{draft.note=e.target.value;};
      if($('fee')){
        $('fee').oninput=e=>{draft.fee=e.target.value; focusFee=true; render();};
        if(focusFee){
          const fe=$('fee'); fe.focus();
          const v=fe.value; fe.value=''; fe.value=v;
          focusFee=false;
        }
      }
      if($('p_new')) $('p_new').oninput=e=>{draft.pName=e.target.value;
        const b=document.getElementById('rec');
        if(b) b.disabled=!(parseFloat(draft.amt||0)>0&&draft.acct&&e.target.value.trim());};
      document.querySelectorAll('[data-tag]').forEach(c=>{c.onclick=()=>{animate=false; draft.tag=c.dataset.tag;render();};});
      document.querySelectorAll('[data-acct]').forEach(c=>{c.onclick=()=>{animate=false; draft.acct=c.dataset.acct;render();};});
      document.querySelectorAll('[data-bk]').forEach(c=>{c.onclick=()=>{animate=false; draft.bucket=c.dataset.bk;render();};});
      document.querySelectorAll('[data-lf]').forEach(c=>{c.onclick=()=>{draft.lendFrom=c.dataset.lf;render();};});
      document.querySelectorAll('[data-per]').forEach(c=>{c.onclick=()=>{animate=false; draft.person=c.dataset.per;render();};});
      document.querySelectorAll('[data-from]').forEach(c=>{c.onclick=()=>{ animate=false;
        draft.from=c.dataset.from; if(draft.to===draft.from) draft.to=null; render();};});
      document.querySelectorAll('[data-to]').forEach(c=>{c.onclick=()=>{animate=false; draft.to=c.dataset.to;render();};});
      if($('rec')) $('rec').onclick=record;
      if(draft.busy&&$('rec')){ $('rec').disabled=true; $('rec').textContent='Uploading…'; }
      if($('attf')) $('attf').onchange=async e=>{
        const files=Array.from(e.target.files||[]); draft.attErr='';
        for(const f of files){
          if(attCount()>=ATT_LIMIT){ draft.attErr='Up to '+ATT_LIMIT+' files per entry.'; break; }
          try{ (draft.newFiles=draft.newFiles||[]).push(await prepFile(f)); }
          catch(err){ draft.attErr=err.message||'Could not use that file.'; }
        }
        animate=false; render();
      };
      document.querySelectorAll('[data-attx]').forEach(x=>{x.onclick=()=>{
        const w=x.dataset.attx, i=+w.slice(1);
        if(w[0]==='a') draft.att.splice(i,1); else draft.newFiles.splice(i,1);
        animate=false; render();};});
    }
    document.querySelectorAll('[data-att]').forEach(x=>{x.onclick=()=>openAtt(x.dataset.att);});
    if($('retry')) $('retry').onclick=async()=>{ await save(); render(); };
    if($('out'))  $('out').onclick=()=>{ if(confirm('Log out of this device?')) signOut(''); };
    if($('acct')) $('acct').onclick=()=>{ panel='acct'; panelErr=''; render(); };
    if($('usr'))  $('usr').onclick=openUsers;
    if($('u_audit')) $('u_audit').onclick=openAudit;
    document.querySelectorAll('[data-uview]').forEach(x=>{x.onclick=()=>{
      const u=usersList.find(v=>v.id===x.dataset.uview); if(u) enterViewAs(u);};});
    document.querySelectorAll('.backAdminBtn').forEach(x=>{x.onclick=exitViewAs;});
    const closePanel=()=>{ panel=null; attView=null; newCred=null; auditList=null; render(); };
    if($('p_x')) $('p_x').onclick=closePanel;
    if($('ovlp')) $('ovlp').onclick=e=>{ if(e.target.id==='ovlp') closePanel(); };
    if($('a_go')) $('a_go').onclick=async()=>{
      const cur=$('a_cur').value, n1=$('a_new').value, n2=$('a_new2').value, m=$('a_msg');
      m.style.color='var(--red)';
      if(n1!==n2){ m.textContent='The new passwords do not match.'; return; }
      if(n1.length<8){ m.textContent='New password must be at least 8 characters.'; return; }
      $('a_go').disabled=true;
      const r=await RPC('changePassword',{current:cur,next:n1});
      $('a_go').disabled=false;
      if(!r.ok){ m.textContent=r.msg||'Could not change the password.'; return; }
      token=r.data.token; lsSet(TOKENKEY,token);
      m.style.color='var(--green)'; m.textContent='✓ Password changed.';
      $('a_cur').value=$('a_new').value=$('a_new2').value='';
    };
    if($('u_add')) $('u_add').onclick=async()=>{
      const name=$('u_name').value.trim(), user=$('u_user').value.trim(), m=$('u_msg');
      m.style.color='var(--red)';
      if(!user){ m.textContent='Enter a username.'; return; }
      $('u_add').disabled=true;
      const r=await RPC('createUser',{name,username:user});
      $('u_add').disabled=false;
      if(!r.ok){ m.textContent=r.msg||'Could not create the user.'; return; }
      newCred={label:'New user created',username:r.data.user.username,password:r.data.password};
      panelErr=''; const l=await RPC('listUsers'); if(l.ok) usersList=l.data; render();
    };
    document.querySelectorAll('[data-ures]').forEach(x=>{x.onclick=async()=>{
      const u=usersList.find(v=>v.id===x.dataset.ures);
      if(!confirm('Reset the password for '+u.username+'? They will be signed out everywhere.')) return;
      const r=await RPC('resetPassword',{userId:u.id});
      if(!r.ok){ panelErr=r.msg||'Could not reset.'; render(); return; }
      newCred={label:'Password reset',username:u.username,password:r.data.password}; panelErr=''; render();};});
    document.querySelectorAll('[data-uact]').forEach(x=>{x.onclick=async()=>{
      const u=usersList.find(v=>v.id===x.dataset.uact), on=x.dataset.on==='1';
      if(!on&&!confirm('Disable '+u.username+'? They will be signed out. Their data is kept.')) return;
      const r=await RPC('setActive',{userId:u.id,active:on});
      if(!r.ok){ panelErr=r.msg||'Could not update.'; render(); return; }
      const l=await RPC('listUsers'); if(l.ok) usersList=l.data; panelErr=''; render();};});

    document.querySelectorAll('[data-del]').forEach(x=>{x.onclick=async()=>{
      if(editId===x.dataset.del){ editId=null; mode=null; draft={}; }
      db.entries=db.entries.filter(e=>e.id!==x.dataset.del); await save(); render();};});

    document.querySelectorAll('[data-edit]').forEach(x=>{x.onclick=()=>{
      const e=db.entries.find(v=>v.id===x.dataset.edit); if(!e) return;
      if(editId===e.id){ editId=null; mode=null; draft={}; render(); return; }   // tap again = cancel
      editId=e.id; sel=e.day; tab='day'; mode=e.type; focusAmt=true;
      draft={amt:String(e.amt/S), att:(e.att||[]).slice(), newFiles:[]};
      if(e.fee>0) draft.fee=String(e.fee/S);
      if(e.type==='xfer'){ draft.from=e.from; draft.to=e.to; }
      else if(e.type==='pin'||e.type==='pout'){ draft.person=e.person; draft.acct=e.acct;
        if(e.type==='pout'){ draft.lendFrom=e.lendFrom||'personal'; } }
      else { draft.tag=e.tag; draft.acct=e.acct; draft.note=e.note||'';
        if(e.type==='out') draft.bucket=e.bucket||'personal'; }
      render(); window.scrollTo(0,0);
    };});

    document.querySelectorAll('[data-ppl]').forEach(x=>{x.onclick=()=>{
      animate=false;
      pplView = (pplView===x.dataset.ppl) ? null : x.dataset.ppl;
      render();
    };});
    if($('theme')) $('theme').onclick=async()=>{
      theme = (theme==='viewport') ? 'vellum' : 'viewport';
      lsSet(THEMEKEY, theme);
      render();
    };
    $('exp').onclick=exportCsv;
    const markedBackedUp=async()=>{ db.lastBackup=Date.now(); await save(); };
    const saveFile=()=>{
      const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='birr-ledger-backup-'+today()+'.json'; a.click();
      URL.revokeObjectURL(url);
    };
    const openBackup=()=>{ showBackup=true; showRestore=false; render(); };
    if($('bak')) $('bak').onclick=openBackup;
    if($('baknow')) $('baknow').onclick=openBackup;
    if($('imp')) $('imp').onclick=()=>{ showRestore=true; showBackup=false; render(); };

    // ---- backup overlay ----
    if($('bk_x'))  $('bk_x').onclick=()=>{ showBackup=false; render(); };
    if($('ovl'))   $('ovl').onclick=e=>{ if(e.target.id==='ovl'){ showBackup=false; render(); } };
    if($('bk_copy')) $('bk_copy').onclick=async()=>{
      const ta=$('bk_text'); let done=false;
      try{ await navigator.clipboard.writeText(ta.value); done=true; }
      catch(e){ try{ ta.focus(); ta.select(); done=document.execCommand('copy'); }catch(_){} }
      const m=$('bk_msg');
      if(done){ if(m){ m.textContent='✓ Copied. Paste it somewhere safe now.'; m.style.color='var(--green)'; } await markedBackedUp(); }
      else if(m){ m.textContent='Select the text above and copy it manually (long-press → Copy).'; m.style.color='var(--ochre)'; }
    };
    if($('bk_file')) $('bk_file').onclick=async()=>{ saveFile(); await markedBackedUp();
      const m=$('bk_msg'); if(m){ m.textContent='If a "keep file?" prompt appears, choose Keep — it is safe.'; m.style.color='var(--ochre)'; } };

    // ---- restore overlay ----
    const applyRestore=async(rawText,fromFile)=>{
      const msg=$('rs_msg');
      try{
        const j=JSON.parse(rawText);
        if(!j||!Array.isArray(j.entries)) throw 0;
        if(!confirm('Replace everything currently in the ledger with this backup?')) return;
        normalize(j);
        sel=today(); editing=false; cfg=null; mode=null; editId=null; showRestore=false;
        await save(); render();
      }catch(err){ if(msg){ msg.textContent=fromFile?'That file is not a ledger backup.':'That text is not a valid backup.'; msg.style.color='var(--red)'; } }
    };
    if($('rs_x')) $('rs_x').onclick=()=>{ showRestore=false; render(); };
    if($('ovlr')) $('ovlr').onclick=e=>{ if(e.target.id==='ovlr'){ showRestore=false; render(); } };
    if($('rs_go')) $('rs_go').onclick=()=>{ const t=$('rs_text').value.trim();
      if(!t){ const m=$('rs_msg'); if(m){ m.textContent='Paste your backup text first.'; m.style.color='var(--ochre)'; } return; }
      applyRestore(t,false); };
    if($('rs_file')) $('rs_file').onclick=()=>$('impf').click();
    $('impf').onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>applyRestore(r.result,true);
      r.readAsText(f);
    };
    if($('edit')) $('edit').onclick=()=>{editing=true;cfgErr='';cfg=null;tab='day';render();window.scrollTo(0,0);};
    if($('reset')) $('reset').onclick=async()=>{
      if(!confirm('Erase everything and start over? This cannot be undone.')) return;
      db={setup:{floor:0,bufferMonths:3,opening:{},envStart:null},entries:[],zero:[],people:[]};
      ACCOUNTS.forEach(a=>db.setup.opening[a]=0);
      sel=today(); editing=false; cfg=null; await save(); render();};
  }

  function syncCfg(){
    if(!cfg) return;
    const g=id=>{const e=document.getElementById(id); return e?e.value:undefined;};
    const f=g('c_floor'); if(f!==undefined) cfg.floor=f;
    const b=g('c_bm');    if(b!==undefined) cfg.bm=b;
    ACCOUNTS.forEach(a=>{ const v=g('c_o_'+a); if(v!==undefined) cfg.opening[a]=v; });
    document.querySelectorAll('.p_n').forEach(i=>{ cfg.people[+i.dataset.i].name=i.value; });
    document.querySelectorAll('.p_a').forEach(i=>{ cfg.people[+i.dataset.i].mag=Math.round((parseFloat(i.value)||0)*S); });
  }

  async function record(){
    const a=toS(draft.amt);
    if(!(a>0)||draft.busy) return;
    // Upload staged files first: if one fails nothing else has changed, and files already uploaded stay
    // attached to the draft so a retry does not upload them twice.
    if(draft.newFiles&&draft.newFiles.length){
      draft.busy=true; draft.attErr=''; animate=false; render();
      draft.att=draft.att||[];
      while(draft.newFiles.length){
        const f=draft.newFiles[0];
        const r=await RPC('upload',{name:f.name,mime:f.mime,b64:f.b64});
        if(!r.ok){ draft.busy=false; draft.attErr=(r.code==='AUTH')?'':(f.name+': '+(r.msg||'upload failed')); if(db) render(); return; }
        draft.att.push({fileId:r.data.fileId,name:r.data.name,mime:r.data.mime,size:r.data.size});
        draft.newFiles.shift();
      }
      draft.busy=false;
    }
    const st=state();
    db.zero=db.zero.filter(z=>z!==sel);
    let fields=null;
    if(mode==='xfer'){
      if(!draft.from||!draft.to||draft.from===draft.to) return;
      fields={type:'xfer',amt:a,from:draft.from,to:draft.to};
    }else if(mode==='pin'||mode==='pout'){
      if(!draft.acct) return;
      let pid=draft.person;
      if(pid==='__new'){
        const nm=(draft.pName||'').trim(); if(!nm) return;
        pid=uid(); db.people.push({id:pid,name:nm,opening:0});
      }
      if(!pid) return;
      fields={type:mode,amt:a,person:pid,acct:draft.acct};
      if(mode==='pout'){ fields.lendFrom=draft.lendFrom||defaultBucket(st); }
    }else{
      if(!draft.tag||!draft.acct) return;
      fields={type:mode,amt:a,tag:draft.tag,acct:draft.acct,
        bucket:(mode==='out')?(draft.bucket||defaultBucket(st)):null,note:(draft.note||'').trim()};
    }
    // Transaction fee: optional, independent of the transaction's own amount/category. Not offered
    // for Earned (no payment channel involved) or From-a-person (the fee, if any, is the sender's
    // cost, not the receiver's — this app only tracks the user's own money).
    if(mode!=='in' && mode!=='pin'){
      const f=toS(draft.fee);
      if(f>0) fields.fee=f;
    }

    if(draft.att&&draft.att.length) fields.att=draft.att.slice();
    if(editId){
      const i=db.entries.findIndex(e=>e.id===editId);
      if(i>=0){
        const kept=db.entries[i];                    // identity, day and original order survive the edit
        db.entries[i]=Object.assign({id:kept.id,day:kept.day,ts:kept.ts},fields);
      }
      editId=null;
    }else{
      db.entries.push(Object.assign({id:uid(),day:sel,ts:Date.now()},fields));
    }
    mode=null; draft={};
    await save(); render();
  }

  function exportCsv(){
    const head='date,type,amount_etb,category,group,account,from,to,bucket,person,note\n';
    const rows=db.entries.slice().sort((a,b)=>a.day<b.day?-1:1).map(e=>{
      if(e.type==='xfer') return [e.day,'transfer',(e.amt/S).toFixed(2),'','','',e.from,e.to,'','','""'].join(',');
      if(e.type==='pin')  return [e.day,'from_person',(e.amt/S).toFixed(2),'','',e.acct,'','','',pName(e.person),'""'].join(',');
      if(e.type==='pout') return [e.day,'to_person',(e.amt/S).toFixed(2),'','',e.acct,'','',e.bucket||'',pName(e.person),'""'].join(',');
      return [e.day,e.type==='in'?'income':'expense',(e.amt/S).toFixed(2),e.tag,
        GROUP_OF[e.tag]||(e.type==='in'?'Income':''),e.acct,'','',e.bucket||'','',
        '"'+(e.note||'').replace(/"/g,'""')+'"'].join(',');
    });
    db.zero.forEach(d=>rows.push(d+',no-spend,0.00,,,,,,,,""'));
    const url=URL.createObjectURL(new Blob([head+rows.join('\n')],{type:'text/csv'}));
    const a=document.createElement('a'); a.href=url; a.download='ledger.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  (async function boot(){
    const th=lsGet(THEMEKEY); if(th==='vellum'||th==='viewport') theme=th;
    token=lsGet(TOKENKEY);
    if(!token){ renderLogin(''); return; }
    document.getElementById('root').innerHTML='<div class="sheet"><p style="color:var(--graphite);font-family:var(--mono)">Loading…</p></div>';
    await enter(null);
  })();
})();
</script>
