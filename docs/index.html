<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0F1418"/>
<title>Birr Ledger</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ledger"/>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0F1418;color:#E9EEEB;font-family:-apple-system,system-ui,sans-serif;padding:24px}
  .card{max-width:360px;width:100%;text-align:center}
  .icon{width:84px;height:84px;border-radius:20px;margin:0 auto 22px;display:block}
  h1{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
  p{color:#8494A0;font-size:14px;line-height:1.6;margin:0 0 26px}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;font-size:15px;font-weight:700;
    cursor:pointer;text-decoration:none;box-sizing:border-box;font-family:inherit}
  .open{background:#5FB8DC;color:#0F1418;margin-bottom:12px}
  .install{background:transparent;border:1.5px solid #3C4952;color:#E9EEEB;display:none}
  .install.show{display:block}
  .hint{margin-top:18px;font-size:12px;color:#5A6771;line-height:1.6;display:none}
  .hint.show{display:block}
  #status{font-size:12px;color:#5A6771;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="icon-192.png" alt=""/>
  <h1>Birr Ledger</h1>
  <p>Your personal cash-flow ledger.</p>
  <a class="btn open" id="open" href="#">Open Ledger</a>
  <button class="btn install" id="install">Install App (adds an icon to your home screen)</button>
  <div class="hint" id="ioshint">On iPhone: tap the <b>Share</b> button below, then <b>"Add to Home Screen"</b>.</div>
  <div id="status"></div>
</div>
<script>
  // Fill this in with your own app's web app URL (ends in /exec).
  const APP_URL = "__APP_URL__";

  document.getElementById('open').href = APP_URL;

  // Launched from the home-screen icon (already installed) -> skip the splash, go straight in.
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    location.replace(APP_URL);
  }

  // Service worker: required by browsers before they'll offer a real Install prompt. See sw.js.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Chrome/Brave/Samsung Internet etc. fire this when the page qualifies for installing; iOS Safari
  // never fires it (Apple doesn't support this API), so iOS always falls back to its own Share sheet.
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('install').classList.add('show');
  });
  document.getElementById('install').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install').classList.remove('show');
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('install').classList.remove('show');
  });

  // iOS Safari: no install API exists, so show the manual instructions instead of a button that
  // would otherwise never appear.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
  if (isIOS && isSafari && window.navigator.standalone !== true) {
    document.getElementById('ioshint').classList.add('show');
  }
</script>
</body>
</html>
